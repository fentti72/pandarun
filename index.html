    boxes(o) {
      const bob = Math.sin(o.age * 4) * 3;
      return [{ x: 4, y: o.baseBottom - o.bodyH + bob, w: o.w - 8, h: o.bodyH }];
    },
    draw(ctx, o, t) {
      const x = o.x, by = o.baseBottom + Math.sin(o.age * 4) * 3;
      ellipse(ctx, x + 23, CONFIG.GROUND_Y + 2, 14, 3, 0, "rgba(0,0,0,0.15)");
      // Tail
      ctx.beginPath();
      ctx.moveTo(x + 36, by - 14); ctx.lineTo(x + 47, by - 20); ctx.lineTo(x + 46, by - 8);
      ctx.closePath();
      ctx.fillStyle = o.color;
      ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.4)";
      ctx.lineWidth = 1.2;
      ctx.stroke();
      // Body, belly, head
      ellipse(ctx, x + 25, by - 13, 15, 11, 0, o.color, "rgba(0,0,0,0.45)", 1.5);
      ellipse(ctx, x + 22, by - 8, 9, 5.5, 0, "rgba(255,255,255,0.6)");
      ellipse(ctx, x + 11, by - 17, 8, 8, 0, o.color, "rgba(0,0,0,0.45)", 1.5);
      ellipse(ctx, x + 9, by - 19, 2.8, 2.8, 0, "#fff");
      ellipse(ctx, x + 8.3, by - 19, 1.5, 1.5, 0, "#111");
      ellipse(ctx, x + 12, by - 14, 2, 1.3, 0, "rgba(255,120,140,0.6)");
      // Beak (points at the panda)
      ctx.beginPath();
      ctx.moveTo(x + 4, by - 18); ctx.lineTo(x - 3, by - 15); ctx.lineTo(x + 4, by - 13);
      ctx.closePath();
      ctx.fillStyle = "#ffb020";
      ctx.fill();
      // Flapping wing (always above the body, decoration)
      ctx.save();
      ctx.translate(x + 26, by - 17);
      ctx.rotate(Math.sin(t * 16 + o.age) * 0.9 - 0.3);
      ellipse(ctx, 0, -9, 6, 11, 0, o.color, "rgba(0,0,0,0.5)", 1.3);
      ellipse(ctx, 0, -12, 3, 5, 0, "rgba(255,255,255,0.3)");
      ctx.restore();
    },
  },
];

const OBSTACLE_BY_ID = Object.fromEntries(OBSTACLE_TYPES.map((t) => [t.id, t]));

// How often each category is picked compared to the others (styles inside a
// category share its weight equally).
const CATEGORY_WEIGHTS = { rock: 2, branch: 2, log: 1, bush: 1, cactus: 1.2, lava: 1.2, beehive: 1, bird: 1 };

class Obstacle {
  // type: a registry entry, an id like "rock-mossy", or a category like "rock"
  // (which picks a random style from that category).
  constructor(type, x) {
    if (typeof type === "string") {
      type = OBSTACLE_BY_ID[type] || choose(OBSTACLE_TYPES.filter((t) => t.category === type));
    }
    this.type = type;
    this.kind = type.kind;       // "ground" or "overhead"
    this.category = type.category;
    this.label = type.label;
    this.x = x;
    this.age = 0;
    this.hasHit = false;         // each obstacle can hurt the panda only once
    type.make(this);
  }

  update(dt, speed) {
    this.age += dt;
    const extra = this.type.movesFaster ? CONFIG.BIRD_EXTRA_SPEED : 0;
    this.x -= (speed + extra) * dt;
  }

  get offscreen() {
    return this.x + this.w < -60;
  }

  // The solid parts, shrunk by HITBOX_INSET, in screen coordinates.
  getHitboxes() {
    return this.type.boxes(this).map((b) => insetBox(this.x + b.x, b.y, b.w, b.h));
  }

  draw(ctx, t) {
    this.type.draw(ctx, this, t);
  }
}


/* =====================================================================
   6. Bamboo - the collectibles
   heightAboveGround is the gap between the ground and the stick's bottom.
   ===================================================================== */
class Bamboo {
  constructor(x, heightAboveGround) {
    this.w = CONFIG.BAMBOO_WIDTH;
    this.h = CONFIG.BAMBOO_HEIGHT;
    this.x = x; // left edge
    this.y = CONFIG.GROUND_Y - heightAboveGround - this.h; // top edge
    this.floating = heightAboveGround > 10;
    this.phase = rand(0, Math.PI * 2);
    this.variant = randInt(0, 2); // e.g. which color a magic crystal is
  }

  update(dt, speed) {
    this.x -= speed * dt;
    this.phase += dt * 3;
  }

  get offscreen() {
    return this.x + this.w < -30;
  }

  // The hitbox does not bob up and down: the bob is only visual.
  getHitbox() {
    return insetBox(this.x, this.y, this.w, this.h);
  }

  // Drawn as the chosen character's collectible (bamboo, bone, crystal...).
  // Whatever it looks like, the hitbox above stays the same.
  draw(ctx, character = CHARACTERS[0], t = 0) {
    const bob = this.floating ? Math.sin(this.phase) * 2 : 0;
    if (this.floating) {
      // Soft glow so floating pickups stand out
      ellipse(ctx, this.x + this.w / 2, this.y + this.h / 2 + bob, 16, 24, 0, "rgba(255,255,200,0.25)");
    }
    character.drawCollectible(ctx, this.x + this.w / 2, this.y + bob, this.h, t + this.phase, this.variant);
  }
}


/* ---------------------------------------------------------------------
   Heart pickup - a rare floating heart that gives an extra life
   --------------------------------------------------------------------- */
class HeartPickup {
  constructor(x, heightAboveGround) {
    this.w = 26;
    this.h = 24;
    this.x = x; // left edge
    this.y = CONFIG.GROUND_Y - heightAboveGround - this.h; // top edge
    this.phase = rand(0, Math.PI * 2);
  }

  update(dt, speed) {
    this.x -= speed * dt;
    this.phase += dt * 3;
  }

  get offscreen() {
    return this.x + this.w < -30;
  }

  getHitbox() {
    return insetBox(this.x, this.y, this.w, this.h);
  }

  draw(ctx) {
    const cx = this.x + this.w / 2;
    const cy = this.y + this.h / 2 + Math.sin(this.phase) * 3;
    // Soft pink glow
    const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, 26);
    g.addColorStop(0, "rgba(255,180,200,0.75)");
    g.addColorStop(1, "rgba(255,180,200,0)");
    ctx.fillStyle = g;
    ctx.fillRect(cx - 28, cy - 28, 56, 56);
    const pulse = 1 + Math.sin(this.phase * 2) * 0.06;
    drawHeart(ctx, cx, cy + 1, this.w * pulse, "#ff3b4f", "#9b1020");
    // Twinkling sparkles circling it
    for (let i = 0; i < 3; i++) {
      const a = this.phase * 0.8 + (i * Math.PI * 2) / 3;
      const s = 2 + 1.5 * Math.abs(Math.sin(this.phase * 2 + i));
      drawStar(ctx, cx + Math.cos(a) * 19, cy + Math.sin(a) * 15, s, "#fff6b0");
    }
  }
}


/* =====================================================================
   7. Background - parallax layers and themed zones
   `scroll` counts how many pixels the world has moved. Each layer moves
   at a fraction of that (its parallax factor). Every layer repeats every
   800px (the screen width), so it loops without a visible seam.
   The colors come from a zone palette (see ZONES), so the scenery can
   fade from one zone to the next.
   ===================================================================== */

// Themed zones. With ZONES_ENABLED, the zone changes every ZONE_EVERY
// bamboo (spring -> autumn -> snow -> desert -> volcano) and obstacles are
// drawn from that zone's set (each obstacle lists its zones).
const ZONES = [
  { id: "spring", name: "Spring Forest",
    sky: ["#7cc6f2", "#cdeefc", "#f4f1d8"], sun: "#fff6c9", far: "#b4cbdc", near: "#93b6ad", mist: "#ffffff",
    forest: "#2d7841", grassTop: "#7cc04f", grassBottom: "#5f9c3a", dirtTop: "#9b7650", dirtBottom: "#6e5136",
    grassLine: "#4f8a2c", tuft: "#3f7d22", pebble: "#857055" },
  { id: "autumn", name: "Autumn Woods",
    sky: ["#f2b97c", "#fbe3c4", "#fdf1dc"], sun: "#fff1c4", far: "#d9b8a6", near: "#c48f6e", mist: "#fff4e6",
    forest: "#8a5426", grassTop: "#c9a24a", grassBottom: "#a77d33", dirtTop: "#8a6142", dirtBottom: "#5e4029",
    grassLine: "#8c6a25", tuft: "#7a5a1c", pebble: "#7a6248" },
  { id: "snow", name: "Snowy Mountain",
    sky: ["#9fb8d6", "#dde8f3", "#f3f6fa"], sun: "#ffffff", far: "#e6edf5", near: "#b8c8da", mist: "#ffffff",
    forest: "#4b6b66", grassTop: "#f4f8fc", grassBottom: "#d4e1ee", dirtTop: "#8c8f9c", dirtBottom: "#5f6170",
    grassLine: "#c4d4e6", tuft: "#a9bcd2", pebble: "#7c8090" },
  { id: "desert", name: "Desert Canyon",
    sky: ["#f6c27a", "#fbe0a8", "#fff2d0"], sun: "#fff8d8", far: "#e7a46b", near: "#c9764a", mist: "#fff1d6",
    forest: "#76793a", grassTop: "#e8c27a", grassBottom: "#d1a35c", dirtTop: "#c08850", dirtBottom: "#8e5a32",
    grassLine: "#b98a48", tuft: "#9a8a3a", pebble: "#9a6a40" },
  { id: "volcano", name: "Volcano",
    sky: ["#3b2a3f", "#7a3b3b", "#d26a3a"], sun: "#ffb36b", far: "#5a3a44", near: "#3e2a30", mist: "#c8603a",
    forest: "#2f2a22", grassTop: "#4a3a34", grassBottom: "#2f2422", dirtTop: "#3a2a26", dirtBottom: "#1e1514",
    grassLine: "#5a2a1c", tuft: "#6a3a24", pebble: "#5a4038" },
];

// "#rrggbb" -> [r, g, b]
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

// Blend two zone palettes: k = 0 gives `a`, k = 1 gives `b`.
// The result holds [r, g, b] arrays; use rgb() to turn one into a color.
function blendPalettes(a, b, k) {
  const out = {};
  for (const key of Object.keys(a)) {
    if (key === "id" || key === "name") continue;
    const mix = (ha, hb) => {
      const ca = hexToRgb(ha), cb = hexToRgb(hb);
      return ca.map((v, i) => v + (cb[i] - v) * k);
    };
    out[key] = Array.isArray(a[key]) ? a[key].map((c, i) => mix(c, b[key][i])) : mix(a[key], b[key]);
  }
  return out;
}

// [r, g, b] (+ optional alpha, + optional brightness offset) -> CSS color
function rgb(c, alpha = 1, add = 0) {
  const [r, g, b] = c.map((v) => Math.max(0, Math.min(255, Math.round(v + add))));
  return alpha === 1 ? `rgb(${r},${g},${b})` : `rgba(${r},${g},${b},${alpha})`;
}

class Background {
  constructor() {
    this.scroll = 0;
    this.period = CONFIG.WIDTH;
    const rnd = seededRandom(42);

    // Mountain shapes are sums of sine waves. Each wave has a whole number
    // of cycles (k) per 800px, so the outline repeats perfectly.
    this.farWaves = [{ k: 2, a: 38, p: 0.3 }, { k: 3, a: 22, p: 1.7 }, { k: 7, a: 9, p: 0.5 }];
    this.nearWaves = [{ k: 1, a: 26, p: 2.1 }, { k: 4, a: 20, p: 0.2 }, { k: 9, a: 7, p: 1.1 }];

    // Bamboo forest silhouette: stalks at random positions within one period
    this.stalks = [];
    for (let i = 0; i < 34; i++) {
      this.stalks.push({
        x: rnd() * this.period,
        w: 5 + rnd() * 6,
        top: 120 + rnd() * 110,
        shade: rnd(),
        leafSide: rnd() < 0.5 ? -1 : 1,
      });
    }
    this.stalks.sort((a, b) => a.shade - b.shade); // darker ones drawn last (in front)

    // Ground decorations: grass tufts and pebbles
    this.tufts = [];
    for (let i = 0; i < 22; i++) this.tufts.push({ x: rnd() * this.period, s: 0.7 + rnd() * 0.6 });
    this.pebbles = [];
    for (let i = 0; i < 26; i++) {
      this.pebbles.push({ x: rnd() * this.period, y: CONFIG.GROUND_Y + 14 + rnd() * 40, r: 1.5 + rnd() * 3 });
    }
  }

  update(dt, speed) {
    this.scroll += speed * dt;
  }

  // Offset of a layer, always between 0 and period
  layerOffset(factor) {
    return (this.scroll * factor) % this.period;
  }

  // Calls drawFn(screenX) for an item placed at x within the period, twice,
  // so items leaving on the left reappear on the right with no gap.
  forEachLooped(x, offset, drawFn) {
    let sx = (x - offset) % this.period;
    if (sx < 0) sx += this.period;
    drawFn(sx);
    drawFn(sx - this.period);
  }

  drawMountains(ctx, waves, factor, baseY, color) {
    const off = this.layerOffset(factor);
    ctx.beginPath();
    ctx.moveTo(0, CONFIG.HEIGHT);
    for (let sx = 0; sx <= CONFIG.WIDTH; sx += 5) {
      const wx = sx + off;
      let h = 0;
      for (const wv of waves) h += wv.a * (0.5 + 0.5 * Math.sin((Math.PI * 2 * wv.k * wx) / this.period + wv.p));
      ctx.lineTo(sx, baseY - h);
    }
    ctx.lineTo(CONFIG.WIDTH, CONFIG.HEIGHT);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  // pal: a palette from blendPalettes()
  draw(ctx, pal) {
    const W = CONFIG.WIDTH, H = CONFIG.HEIGHT, GY = CONFIG.GROUND_Y;

    // --- Layer 1 (far, slowest): sky, sun and misty mountains ---
    const sky = ctx.createLinearGradient(0, 0, 0, GY);
    sky.addColorStop(0, rgb(pal.sky[0]));
    sky.addColorStop(0.6, rgb(pal.sky[1]));
    sky.addColorStop(1, rgb(pal.sky[2]));
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);
    ellipse(ctx, 640, 75, 46, 46, 0, rgb(pal.sun, 0.45));
    ellipse(ctx, 640, 75, 32, 32, 0, rgb(pal.sun));

    this.drawMountains(ctx, this.farWaves, CONFIG.PARALLAX_FAR, 240, rgb(pal.far));
    this.drawMountains(ctx, this.nearWaves, CONFIG.PARALLAX_MOUNTAINS, 275, rgb(pal.near));
    // Mist band
    const mist = ctx.createLinearGradient(0, 200, 0, 300);
    mist.addColorStop(0, rgb(pal.mist, 0));
    mist.addColorStop(1, rgb(pal.mist, 0.55));
    ctx.fillStyle = mist;
    ctx.fillRect(0, 200, W, 100);

    // --- Layer 2 (middle): bamboo forest silhouette ---
    const fOff = this.layerOffset(CONFIG.PARALLAX_FOREST);
    ctx.globalAlpha = 0.6; // faded so it reads as "far away" and the bamboo pickups stand out
    for (const s of this.stalks) {
      const color = rgb(pal.forest, 1, s.shade * 40);
      this.forEachLooped(s.x, fOff, (sx) => {
        if (sx < -40 || sx > W + 40) return;
        ctx.fillStyle = color;
        ctx.fillRect(sx, s.top, s.w, GY - s.top);
        // Joints
        ctx.fillStyle = "rgba(0,0,0,0.15)";
        for (let y = s.top + 18; y < GY; y += 24) ctx.fillRect(sx - 1, y, s.w + 2, 2);
        // Leaves
        ellipse(ctx, sx + s.w / 2 + s.leafSide * 12, s.top + 8, 14, 4, s.leafSide * -0.5, color);
        ellipse(ctx, sx + s.w / 2 - s.leafSide * 10, s.top + 30, 12, 3.5, s.leafSide * 0.5, color);
      });
    }
    ctx.globalAlpha = 1;

    // --- Layer 3 (near): ground strip, same speed as obstacles ---
    const ground = ctx.createLinearGradient(0, GY, 0, H);
    ground.addColorStop(0, rgb(pal.grassTop));
    ground.addColorStop(0.18, rgb(pal.grassBottom));
    ground.addColorStop(0.2, rgb(pal.dirtTop));
    ground.addColorStop(1, rgb(pal.dirtBottom));
    ctx.fillStyle = ground;
    ctx.fillRect(0, GY, W, H - GY);
    ctx.fillStyle = rgb(pal.grassLine);
    ctx.fillRect(0, GY, W, 3);

    const gOff = this.layerOffset(CONFIG.PARALLAX_GROUND);
    const pebble = rgb(pal.pebble);
    for (const p of this.pebbles) {
      this.forEachLooped(p.x, gOff, (sx) => {
        ellipse(ctx, sx, p.y, p.r * 1.3, p.r, 0, pebble);
        ellipse(ctx, sx - p.r * 0.3, p.y - p.r * 0.3, p.r * 0.4, p.r * 0.3, 0, "rgba(255,255,255,0.25)");
      });
    }
    ctx.strokeStyle = rgb(pal.tuft);
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    for (const t of this.tufts) {
      this.forEachLooped(t.x, gOff, (sx) => {
        ctx.beginPath();
        for (let i = -1; i <= 1; i++) {
          ctx.moveTo(sx + i * 3, GY + 2);
          ctx.lineTo(sx + i * 5 * t.s, GY - 8 * t.s - (i === 0 ? 3 : 0));
        }
        ctx.stroke();
      });
    }
  }
}


/* =====================================================================
   8. Game - ties everything together
   States: "title" -> "playing" <-> "paused"
                      "playing" -> "gameover" | "win" -> "playing"
   ===================================================================== */
class Game {
  constructor(sound) {
    this.sound = sound;
    this.panda = new Panda();
    this.background = new Background();
    this.state = "title";
    this.debug = false;     // H toggles hitbox outlines
    this.bestScore = 0;     // best bamboo count this session
    this.time = 0;          // total time, used for animations
    this.keys = new Set();  // keys currently held down
    this.fps = 60;
    this.characterIndex = 0; // chosen character (remembered for the session)
    this.selectIndex = 0;    // highlighted card on the Character Select screen
    this.trailTimer = 0;     // for the unicorn's sparkle trail
    this.showcaseIndex = 0; // which item the "O" gallery is showing
    this.showcaseItem = null;
    this.resetRun();
  }

  // Clear everything for a fresh run.
  resetRun() {
    this.count = 0;              // bamboo collected this run
    this.obstacles = [];
    this.bamboos = [];
    this.particles = [];         // "+1" pops and sparkles
    this.confetti = [];
    this.pickups = [];           // heart pickups on screen
    this.hitBy = null;           // label of the obstacle that ended the run
    this.hitMessage = "";        // e.g. "bonked into a rock"
    this.lastTypeId = null;      // never spawn the same style twice in a row
    this.zoneIndex = 0;          // current zone (index into ZONES)
    this.zoneFrom = 0;           // zone we are fading from
    this.zoneBlend = 1;          // 0..1 progress of that fade
    this.endTime = 0;            // when the run ended
    this.lives = CONFIG.START_LIVES;
    this.heartSlots = CONFIG.START_LIVES; // hearts shown in the HUD (grows when a 3rd is earned)
    this.heartLostAt = [];       // heartLostAt[i] = time heart i was lost (for its animation)
    this.heartGainedAt = [];     // heartGainedAt[i] = time heart i was gained (pop animation)
    this.bambooAtLastHeart = 0;  // bamboo count when the last heart pickup appeared
    this.invincibleTimer = 0;    // > 0 while the panda flashes and can't be hurt
    this.panda.reset();
    // Distance (px) still to scroll before the next obstacle appears
    this.distToNextObstacle = CONFIG.START_SPEED * CONFIG.FIRST_OBSTACLE_DELAY;
    this.nextObstacleType = this.pickObstacleType();
  }

  get character() {
    return CHARACTERS[this.characterIndex];
  }

  // Current scroll speed: a small bump every SPEED_STEP_EVERY bamboo.
  get speedLevel() {
    return Math.floor(this.count / CONFIG.SPEED_STEP_EVERY);
  }
  get speed() {
    return Math.min(CONFIG.MAX_SPEED, CONFIG.START_SPEED + this.speedLevel * CONFIG.SPEED_STEP);
  }

  // The current colors: a blend between the previous and the current zone.
  get palette() {
    return blendPalettes(ZONES[this.zoneFrom], ZONES[this.zoneIndex], this.zoneBlend);
  }

  // Choose the next obstacle style from the registry:
  //  - only styles unlocked by the bamboo count (minBamboo)
  //  - only styles of the current zone (when zones are on)
  //  - ground or overhead by OVERHEAD_CHANCE
  //  - a category by CATEGORY_WEIGHTS, then a style in it
  //  - never the same style twice in a row
  pickObstacleType() {
    const zone = ZONES[this.zoneIndex].id;
    const unlocked = OBSTACLE_TYPES.filter((t) => this.count >= t.minBamboo);
    let pool = CONFIG.ZONES_ENABLED ? unlocked.filter((t) => t.zones.includes(zone)) : unlocked;
    if (!pool.length) pool = unlocked;
    const wantKind = Math.random() < CONFIG.OVERHEAD_CHANCE ? "overhead" : "ground";
    let choices = pool.filter((t) => t.kind === wantKind);
    if (!choices.length) choices = pool;
    if (choices.length > 1) choices = choices.filter((t) => t.id !== this.lastTypeId);
    const cats = [...new Set(choices.map((t) => t.category))];
    const weight = (c) => CATEGORY_WEIGHTS[c] ?? 1;
    let r = Math.random() * cats.reduce((sum, c) => sum + weight(c), 0);
    let cat = cats[cats.length - 1];
    for (const c of cats) {
      r -= weight(c);
      if (r <= 0) { cat = c; break; }
    }
    const type = choose(choices.filter((t) => t.category === cat));
    this.lastTypeId = type.id;
    return type;
  }

  /* ------------------------- State changes ------------------------- */

  start() {
    this.resetRun();
    this.state = "playing";
    this.panda.setDuck(this.keys.has("ArrowDown"));
    // Bamboo in the stretch before the first obstacle, so there is
    // something to grab right away.
    const firstObstacleX = CONFIG.WIDTH + 20 + this.distToNextObstacle;
    this.placeBambooPatterns(CONFIG.WIDTH - 200, firstObstacleX);
    // Music may already be playing from the Character Select screen
    if (this.sound.music.state !== "playing") this.sound.music.start();
  }

  // Character Select screen (the music starts here so the game flows in)
  openSelect() {
    this.resetRun();
    this.state = "select";
    this.selectIndex = this.characterIndex; // last choice is highlighted
    if (this.sound.music.state !== "playing") this.sound.music.start();
  }

  pickCharacter(i) {
    this.characterIndex = this.selectIndex = i;
    this.start();
  }

  // Card layout on the Character Select screen
  selectCard(i) {
    const n = CHARACTERS.length, w = 190, gap = 30;
    const left = (CONFIG.WIDTH - (n * w + (n - 1) * gap)) / 2;
    return { x: left + i * (w + gap), y: 62, w, h: 262 };
  }

  // Mouse / touch click, in game coordinates
  onClick(x, y) {
    if (this.state === "title") {
      this.openSelect();
    } else if (this.state === "select") {
      CHARACTERS.forEach((c, i) => {
        const r = this.selectCard(i);
        if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) this.pickCharacter(i);
      });
    }
  }

  pause() {
    if (this.state === "playing") {
      this.state = "paused";
      this.sound.music.pause();
    }
  }

  resume() {
    if (this.state === "paused") {
      this.state = "playing";
      this.panda.setDuck(this.keys.has("ArrowDown"));
      this.sound.music.resume();
    }
  }

  gameOver(obstacle) {
    this.state = "gameover";
    this.hitBy = obstacle.label;
    this.hitMessage = obstacle.type.message || `bonked into a ${obstacle.label}`;
    this.endTime = this.time;
    this.bestScore = Math.max(this.bestScore, this.count);
    this.panda.wantsDuck = false;
    this.panda.vy = Math.max(this.panda.vy, 0); // stop rising, fall to the ground
    this.invincibleTimer = 0;
    this.sound.music.stop();
    this.sound.thud();
  }

  win() {
    this.state = "win";
    this.endTime = this.time;
    this.bestScore = Math.max(this.bestScore, this.count);
    this.invincibleTimer = 0;
    this.sound.music.stop(); // so the jingle plays on its own
    this.sound.win();
    // Confetti and falling bamboo leaves
    const colors = ["#ff6b6b", "#ffd93d", "#6bcB77", "#4d96ff", "#ff9ff3", "#ffffff"];
    for (let i = 0; i < 160; i++) {
      this.confetti.push({
        x: rand(0, CONFIG.WIDTH),
        y: rand(-CONFIG.HEIGHT, 0),
        vx: rand(-30, 30),
        vy: rand(60, 150),
        rot: rand(0, Math.PI * 2),
        vr: rand(-6, 6),
        special: i % 3 === 0, // themed piece: leaf, bone or crystal
        variant: i % 3,
        color: choose(colors),
      });
    }
  }

  /* ---------------------------- Input ------------------------------ */

  onKeyDown(e) {
    const key = e.key;
    const isStartKey = key === " " || key === "Spacebar" || e.code === "Space" || key === "Enter";
    if (!e.repeat) this.keys.add(key);

    if (key === "h" || key === "H") { this.debug = !this.debug; return; }
    if (key === "m" || key === "M") { this.sound.toggleMute(); return; }
    // O: debug gallery of every obstacle style (not during active play)
    if ((key === "o" || key === "O") && this.state !== "playing") {
      this.showcaseStep(e.shiftKey ? -1 : 1);
      return;
    }

    switch (this.state) {
      case "title":
        if (isStartKey) this.openSelect();
        break;
      case "select": {
        const n = CHARACTERS.length;
        if (key === "ArrowLeft") this.selectIndex = (this.selectIndex - 1 + n) % n;
        if (key === "ArrowRight") this.selectIndex = (this.selectIndex + 1) % n;
        const num = Number(key);
        if (num >= 1 && num <= n) this.pickCharacter(num - 1);
        else if (isStartKey) this.pickCharacter(this.selectIndex);
        else if (key === "Escape") { this.sound.music.stop(); this.state = "title"; }
        break;
      }
      case "playing":
        if (key === "ArrowUp" && !e.repeat) this.panda.requestJump();
        if (key === "ArrowDown") this.panda.setDuck(true);
        if (key === "p" || key === "P" || key === "Escape") this.pause();
        break;
      case "paused":
        if (key === "p" || key === "P" || key === "Escape" || isStartKey) this.resume();
        break;
      case "gameover":
      case "win":
        if (isStartKey && this.time - this.endTime > CONFIG.RESTART_DELAY) this.start(); // same character
        if (key === "c" || key === "C") this.openSelect();
        break;
      case "showcase":
        if (key === "Escape" || isStartKey) {
          this.resetRun();
          this.state = "title";
        }
        break;
    }
  }

  // Step through the gallery: every registry entry, then the heart pickup.
  showcaseStep(dir) {
    const list = [...OBSTACLE_TYPES, "heart", ...CHARACTERS.map((c) => ({ character: c }))];
    if (this.state !== "showcase") {
      this.sound.music.stop();
      this.state = "showcase";
      this.showcaseIndex = dir > 0 ? 0 : list.length - 1;
    } else {
      this.showcaseIndex = (this.showcaseIndex + dir + list.length) % list.length;
    }
    this.panda.reset();
    const entry = list[this.showcaseIndex];
    if (entry === "heart") {
      this.showcaseItem = new HeartPickup(420 - 13, CONFIG.BAMBOO_MID_HEIGHT);
      this.showcaseZone = 0;
    } else if (entry.character) {
      this.showcaseItem = { characterPage: entry.character };
      this.showcaseZone = 0;
    } else {
      const o = new Obstacle(entry, 0);
      o.x = 420 - o.w / 2;
      this.showcaseItem = o;
      this.showcaseZone = Math.max(0, ZONES.findIndex((z) => z.id === entry.zones[0]));
    }
  }

  onKeyUp(e) {
    this.keys.delete(e.key);
    if (e.key === "ArrowDown") this.panda.setDuck(false);
  }

  // Called when the tab/window loses focus.
  onBlur() {
    this.keys.clear();
    this.panda.setDuck(false);
    this.pause();
  }

  /* --------------------------- Spawning ---------------------------- */

  spawnObstacle() {
    // Spawn just off the right edge. distToNextObstacle is <= 0 here; adding
    // it keeps spacing exact even if we overshot a little this frame.
    const x = CONFIG.WIDTH + 20 + this.distToNextObstacle;
    const type = this.nextObstacleType;
    const obs = new Obstacle(type, x);
    this.obstacles.push(obs);

    // Decide what comes next and how far away it is.
    const next = this.pickObstacleType();
    this.nextObstacleType = next;
    const randomPart = Math.max(CONFIG.RANDOM_GAP_MIN, CONFIG.RANDOM_GAP - this.speedLevel * CONFIG.RANDOM_GAP_SHRINK);
    let gapTime = CONFIG.MIN_OBSTACLE_GAP + rand(0, randomPart);
    if (next.kind !== type.kind) gapTime += CONFIG.MIXED_GAP_BONUS; // jump<->duck needs a bit more time
    // Convert time to pixels. We use the speed one step faster than now, in
    // case the player speeds up before reaching the next obstacle; that way
    // the minimum gap in seconds is still respected.
    const safeSpeed = Math.min(CONFIG.MAX_SPEED, this.speed + CONFIG.SPEED_STEP);
    let gapPx = obs.w + gapTime * safeSpeed;
    // A bird flies faster than the ground, so it catches up on whatever is in
    // front of it. Add the distance it can gain before it reaches the panda.
    if (next.movesFaster) gapPx += ((CONFIG.WIDTH + 20 - CONFIG.PANDA_X) * CONFIG.BIRD_EXTRA_SPEED) / this.speed;
    this.distToNextObstacle += gapPx;
    const nextObstacleX = obs.x + gapPx;

    // Optional reward tied to this obstacle: a rare heart, or a bamboo stick
    const bw = CONFIG.BAMBOO_WIDTH;
    if (this.maybeSpawnHeart(obs)) {
      // the heart is the reward this time
    } else if (obs.kind === "ground" && Math.random() < CONFIG.ROCK_REWARD_CHANCE) {
      // Floating above the obstacle: grabbed by jumping over it
      this.bamboos.push(new Bamboo(obs.x + obs.w / 2 - bw / 2, CONFIG.BAMBOO_REWARD_HEIGHT));
    } else if (obs.kind === "overhead" && !type.movesFaster && Math.random() < CONFIG.BRANCH_REWARD_CHANCE) {
      // Low stick under the branch: grabbed by ducking (fits below it)
      this.bamboos.push(new Bamboo(obs.x + obs.w * 0.35, CONFIG.BAMBOO_GROUND_HEIGHT));
    }

    // Bamboo patterns in the empty stretch between this obstacle and the next
    this.placeBambooPatterns(obs.x + obs.w, nextObstacleX);
  }

  // Rarely put a heart pickup above a ground obstacle (jump to get it) or
  // under an overhead one (duck to get it). Returns true if one was placed.
  maybeSpawnHeart(obs) {
    if (this.lives >= CONFIG.MAX_LIVES) return false;        // already full
    if (this.pickups.length) return false;                    // one at a time
    if (this.count - this.bambooAtLastHeart < CONFIG.HEART_MIN_BAMBOO_GAP) return false;
    if (obs.type.movesFaster) return false;                   // not tied to a bird
    if (Math.random() >= CONFIG.HEART_SPAWN_CHANCE) return false;
    const hw = 26;
    if (obs.kind === "ground") {
      this.pickups.push(new HeartPickup(obs.x + obs.w / 2 - hw / 2, CONFIG.BAMBOO_REWARD_HEIGHT));
    } else {
      this.pickups.push(new HeartPickup(obs.x + obs.w * 0.35, CONFIG.BAMBOO_GROUND_HEIGHT));
    }
    this.bambooAtLastHeart = this.count;
    return true;
  }

  // Fill the free space between two x positions with bamboo patterns,
  // keeping a margin from obstacles at both ends.
  placeBambooPatterns(startX, endX) {
    const speed = this.speed;
    const margin = CONFIG.BAMBOO_OBSTACLE_MARGIN;
    const airTime = (2 * CONFIG.JUMP_VELOCITY) / CONFIG.GRAVITY;
    const peak = (CONFIG.JUMP_VELOCITY * CONFIG.JUMP_VELOCITY) / (2 * CONFIG.GRAVITY);
    let cursor = startX + margin;

    for (let tries = 0; tries < 4; tries++) {
      const pattern = this.makePattern(speed, airTime, peak);
      // Patterns that need a jump get extra room so the player can take off
      // after the previous obstacle and land before the next one.
      const before = pattern.needsJump ? speed * 0.25 : 0;
      const after = pattern.needsJump ? speed * 0.35 : 0;
      const left = cursor + before;
      if (left + pattern.width + after > endX - margin) {
        if (pattern.width > CONFIG.BAMBOO_WIDTH) continue; // try a smaller pattern
        break;
      }
      for (const stick of pattern.sticks) this.bamboos.push(new Bamboo(left + stick.dx, stick.h));
      cursor = left + pattern.width + after + rand(60, 160);
      if (Math.random() < 0.35) break; // leave some stretches emptier
    }
  }

  // Build a random bamboo pattern. Returns { sticks: [{dx, h}], width, needsJump }.
  makePattern(speed, airTime, peak) {
    const GH = CONFIG.BAMBOO_GROUND_HEIGHT, MH = CONFIG.BAMBOO_MID_HEIGHT;
    const sp = CONFIG.BAMBOO_PATTERN_SPACING, bw = CONFIG.BAMBOO_WIDTH;
    const r = Math.random();
    const sticks = [];
    let needsJump = false;

    if (r < 0.25) {
      sticks.push({ dx: 0, h: GH });                              // single, on the ground
    } else if (r < 0.42) {
      sticks.push({ dx: 0, h: MH }); needsJump = true;            // single, mid-jump height
    } else if (r < 0.7) {
      const n = randInt(3, 5);                                    // ground row of 3-5
      for (let i = 0; i < n; i++) sticks.push({ dx: i * sp, h: GH });
    } else if (r < 0.8) {
      for (let i = 0; i < 3; i++) sticks.push({ dx: i * sp, h: MH }); // floating row of 3
      needsJump = true;
    } else {
      // Arc of 3-5 that follows the panda's real jump curve, so a single
      // well-timed jump collects them all.
      const n = randInt(3, 5);
      const range = speed * airTime; // horizontal distance covered during a jump
      for (let i = 0; i < n; i++) {
        const u = 0.15 + (0.7 * i) / (n - 1);          // fraction of the jump
        const pandaBottom = peak * 4 * u * (1 - u);    // panda's feet height then
        sticks.push({ dx: (u - 0.15) * range, h: pandaBottom + 14 });
      }
      needsJump = true;
    }
    const width = sticks[sticks.length - 1].dx + bw;
    return { sticks, width, needsJump };
  }

  /* ---------------------------- Update ----------------------------- */

  update(dt) {
    this.time += dt;
    switch (this.state) {
      case "title":
        this.background.update(dt, CONFIG.TITLE_SCROLL_SPEED);
        break;
      case "playing":
        this.updatePlaying(dt);
        break;
      case "gameover":
        this.panda.update(dt); // finish falling to the ground
        this.updateParticles(dt);
        break;
      case "win":
        this.updateParticles(dt);
        this.updateConfetti(dt);
        break;
      case "showcase":
        if (this.showcaseItem && "age" in this.showcaseItem) this.showcaseItem.age += dt;
        if (this.showcaseItem && "phase" in this.showcaseItem) this.showcaseItem.phase += dt * 3;
        break;
      // "paused": nothing moves
    }
  }

  updatePlaying(dt) {
    const speed = this.speed;
    this.background.update(dt, speed * CONFIG.PARALLAX_GROUND);
    this.zoneBlend = Math.min(1, this.zoneBlend + dt / CONFIG.ZONE_FADE_TIME);

    // Panda physics (legs animate faster when the world is faster)
    if (this.panda.update(dt, speed / CONFIG.START_SPEED)) this.sound.jump();
    // Unicorn: a little sparkle trail drifting off behind her
    if (this.character.sparkleTrail) {
      this.trailTimer += dt;
      if (this.trailTimer > 0.06) {
        this.trailTimer = 0;
        const p = this.panda;
        this.particles.push({
          type: "spark", x: p.x - 24, y: p.y - (p.isDucking ? 14 : 32) + rand(-8, 8),
          vx: -speed * 0.6 - 30, vy: rand(-25, 10), life: 0.45, max: 0.45,
          color: choose(this.character.sparkColors), size: 2.5,
        });
      }
    }

    // Move obstacles and bamboo, drop the ones that left the screen
    for (const o of this.obstacles) o.update(dt, speed);
    for (const b of this.bamboos) b.update(dt, speed);
    for (const h of this.pickups) h.update(dt, speed);
    this.obstacles = this.obstacles.filter((o) => !o.offscreen);
    this.bamboos = this.bamboos.filter((b) => !b.offscreen);
    this.pickups = this.pickups.filter((h) => !h.offscreen);

    // Spawn the next obstacle when enough distance has scrolled by
    this.distToNextObstacle -= speed * dt;
    if (this.distToNextObstacle <= 0) this.spawnObstacle();

    // --- Collisions ---
    const pandaBox = this.panda.getHitbox();

    // Bamboo first: grabbing the 50th stick wins immediately.
    for (let i = this.bamboos.length - 1; i >= 0; i--) {
      const b = this.bamboos[i];
      if (overlaps(pandaBox, b.getHitbox())) {
        this.bamboos.splice(i, 1);
        this.collect(b);
        if (this.state !== "playing") return; // we just won
      }
    }
    for (let i = this.pickups.length - 1; i >= 0; i--) {
      if (overlaps(pandaBox, this.pickups[i].getHitbox())) this.collectHeart(this.pickups.splice(i, 1)[0]);
    }

    // Touching an obstacle costs a heart, unless the panda is still flashing
    // from the last hit. Each obstacle can only ever hurt him once.
    if (this.invincibleTimer > 0) {
      this.invincibleTimer = Math.max(0, this.invincibleTimer - dt);
    } else {
      for (const o of this.obstacles) {
        if (o.hasHit) continue;
        if (o.getHitboxes().some((box) => overlaps(pandaBox, box))) {
          o.hasHit = true;
          this.loseLife(o);
          if (this.state !== "playing") return; // that was the last heart
          break;
        }
      }
    }

    this.updateParticles(dt);
  }

  loseLife(obstacle) {
    this.lives--;
    this.heartLostAt[this.lives] = this.time;
    if (obstacle.category === "lava") this.sound.sizzle();
    if (this.lives <= 0) {
      this.gameOver(obstacle);
      return;
    }
    this.invincibleTimer = CONFIG.INVINCIBLE_TIME;
    this.sound.ouch(this.character.ouch);
    this.particles.push({ type: "ouch", text: "Ouch!", x: this.panda.x + 10, y: this.panda.y - 95,
      vy: -30, life: 0.9, max: 0.9 });
  }

  // Is the panda in the "hidden" half of a flash right now?
  get flashHidden() {
    if (this.invincibleTimer <= 0) return false;
    return Math.floor(this.invincibleTimer * CONFIG.INVINCIBLE_FLASH_HZ * 2) % 2 === 1;
  }

  collect(b) {
    this.count++;
    this.sound.collect(this.character.collectSound);
    const cx = b.x + b.w / 2, cy = b.y;
    this.particles.push({ type: "text", text: "+1", x: cx, y: cy, vy: -60, life: 0.8, max: 0.8 });
    const burst = this.character.sparkleTrail ? 14 : 7; // crystals burst bigger
    for (let i = 0; i < burst; i++) {
      const a = rand(0, Math.PI * 2);
      this.particles.push({
        type: "spark", x: cx, y: cy + b.h / 2,
        vx: Math.cos(a) * rand(60, 140), vy: Math.sin(a) * rand(60, 140),
        life: 0.5, max: 0.5, color: choose(this.character.sparkColors),
      });
    }
    if (this.count >= CONFIG.WIN_TARGET) {
      this.win();
      return;
    }
    if (this.count % CONFIG.SPEED_STEP_EVERY === 0 &&
        CONFIG.START_SPEED + this.speedLevel * CONFIG.SPEED_STEP <= CONFIG.MAX_SPEED) {
      this.sound.levelUp();
      this.particles.push({ type: "banner", text: "Faster!", x: CONFIG.WIDTH / 2, y: 120, vy: -15, life: 1.3, max: 1.3 });
    }
    // Every ZONE_EVERY bamboo: move on to the next themed zone
    if (CONFIG.ZONES_ENABLED && this.count % CONFIG.ZONE_EVERY === 0) {
      const z = Math.floor(this.count / CONFIG.ZONE_EVERY) % ZONES.length;
      if (z !== this.zoneIndex) {
        this.zoneFrom = this.zoneIndex;
        this.zoneIndex = z;
        this.zoneBlend = 0;
        this.particles.push({ type: "zone", text: ZONES[z].name, x: CONFIG.WIDTH / 2, y: 165, vy: -8, life: 2, max: 2 });
      }
    }
  }

  collectHeart(h) {
    if (this.lives < CONFIG.MAX_LIVES) {
      this.lives++;
      this.heartSlots = Math.max(this.heartSlots, this.lives);
      this.heartGainedAt[this.lives - 1] = this.time;
    }
    this.sound.powerUp();
    this.particles.push({ type: "heart", text: "+1", x: h.x + h.w / 2 - 8, y: h.y, vy: -50, life: 1.1, max: 1.1 });
    for (let i = 0; i < 9; i++) {
      const a = rand(0, Math.PI * 2);
      this.particles.push({
        type: "spark", x: h.x + h.w / 2, y: h.y + h.h / 2,
        vx: Math.cos(a) * rand(60, 150), vy: Math.sin(a) * rand(60, 150),
        life: 0.6, max: 0.6, color: choose(["#ff8fa3", "#fff6b0", "#ffffff"]),
      });
    }
  }

  updateParticles(dt) {
    for (const p of this.particles) {
      p.life -= dt;
      p.y += p.vy * dt;
      if (p.vx) p.x += p.vx * dt;
    }
    this.particles = this.particles.filter((p) => p.life > 0);
  }

  updateConfetti(dt) {
    for (const c of this.confetti) {
      c.x += (c.vx + Math.sin(this.time * 2 + c.rot) * 20) * dt;
      c.y += c.vy * dt;
      c.rot += c.vr * dt;
      if (c.y > CONFIG.HEIGHT + 10) { c.y = -10; c.x = rand(0, CONFIG.WIDTH); }
    }
  }

  /* ---------------------------- Drawing ---------------------------- */

  draw(ctx) {
    if (this.state === "showcase") {
      this.drawShowcase(ctx);
      return;
    }
    if (this.state === "select") {
      this.drawSelect(ctx);
      return;
    }
    this.background.draw(ctx, this.palette);
    for (const b of this.bamboos) b.draw(ctx, this.character, this.time);
    for (const h of this.pickups) h.draw(ctx);
    for (const o of this.obstacles) o.draw(ctx, this.time);

    // Panda pose depends on the game state
    let mode = "run";
    if (this.state === "title") mode = "idle";
    else if (this.state === "gameover" && this.panda.onGround) mode = "dizzy";
    else if (this.state === "win") mode = "happy";
    if (this.state === "win") {
      // Happy hopping
      this.panda.y = CONFIG.GROUND_Y - Math.abs(Math.sin((this.time - this.endTime) * 6)) * 28;
    }
    if (this.flashHidden) ctx.globalAlpha = 0.25; // blink while invincible
    this.panda.draw(ctx, mode, this.time, this.character);
    ctx.globalAlpha = 1;

    this.drawParticles(ctx);
    if (this.state === "win") this.drawConfetti(ctx);
    if (this.state !== "title") this.drawHUD(ctx);

    if (this.state === "title") this.drawTitle(ctx);
    else if (this.state === "paused") this.drawPaused(ctx);
    else if (this.state === "gameover") this.drawGameOver(ctx);
    else if (this.state === "win") this.drawWin(ctx);

    if (this.debug) this.drawDebug(ctx);
  }

  drawParticles(ctx) {
    for (const p of this.particles) {
      const alpha = Math.max(0, p.life / p.max);
      ctx.globalAlpha = alpha;
      if (p.type === "text") {
        drawText(ctx, p.text, p.x, p.y, 20, "#fff4a3", { stroke: "#3f7d22", strokeWidth: 4 });
      } else if (p.type === "ouch") {
        drawText(ctx, p.text, p.x, p.y, 22, "#ffffff", { stroke: "#c0392b", strokeWidth: 5 });
      } else if (p.type === "heart") {
        drawText(ctx, p.text, p.x, p.y, 22, "#ffffff", { stroke: "#c2185b", strokeWidth: 5 });
        drawHeart(ctx, p.x + 26, p.y, 18, "#ff3b4f", "#9b1020");
      } else if (p.type === "zone") {
        drawText(ctx, p.text, p.x, p.y, 26, "#ffffff", { stroke: "#2f5d1a", strokeWidth: 6 });
      } else if (p.type === "banner") {
        drawText(ctx, p.text, p.x, p.y, 36, "#ffffff", { stroke: "#d35400", strokeWidth: 6 });
      } else {
        drawStar(ctx, p.x, p.y, p.size || 4, p.color);
      }
    }
    ctx.globalAlpha = 1;
  }

  drawConfetti(ctx) {
    for (const c of this.confetti) {
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(c.rot);
      if (c.special && this.character.id === "panda") {
        ellipse(ctx, 0, 0, 9, 3.5, 0, "#5cae43", "#2f6b1a", 1); // bamboo leaf
      } else if (c.special) {
        this.character.drawCollectible(ctx, 0, -9, 18, this.time, c.variant); // mini bone / crystal
      } else {
        ctx.fillStyle = c.color;
        ctx.fillRect(-4, -2.5, 8, 5);
      }
      ctx.restore();
    }
  }

  drawHUD(ctx) {
    // Panel in the top-left corner
    ctx.save();
    roundRectPath(ctx, 12, 10, 200, 58, 12);
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.fill();
    ctx.restore();
    this.character.drawCollectible(ctx, 34, 16, 40, this.time, 1);
    drawText(ctx, `${this.count} / ${CONFIG.WIN_TARGET}`, 58, 30, 24, this.character.accent, { align: "left" });

    // Progress bar toward the goal
    const bx = 58, by = 46, bw = 140, bh = 12;
    roundRectPath(ctx, bx, by, bw, bh, 6);
    ctx.fillStyle = "#dfe8d4";
    ctx.fill();
    const frac = Math.min(1, this.count / CONFIG.WIN_TARGET);
    if (frac > 0) {
      roundRectPath(ctx, bx, by, Math.max(bh, bw * frac), bh, 6);
      ctx.fillStyle = "#5fb83a";
      ctx.fill();
    }
    roundRectPath(ctx, bx, by, bw, bh, 6);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#3f7d22";
    ctx.stroke();

    this.drawHearts(ctx);

    // Small help text in the bottom-right corner, on the dirt
    const soundLabel = this.sound.muted ? "M: sound off" : "M: sound on";
    drawText(ctx, `P: pause   ${soundLabel}   H: hitboxes`, CONFIG.WIDTH - 14, CONFIG.HEIGHT - 12, 12,
      "rgba(255,245,225,0.8)", { align: "right" });
  }

  // Hearts in the top-right corner: red = life left, gray outline = used.
  // A newly earned heart pops in with a quick grow animation.
  drawHearts(ctx) {
    const size = 26, gap = 36;
    const firstX = CONFIG.WIDTH - 30 - (Math.max(CONFIG.MAX_LIVES, CONFIG.START_LIVES) - 1) * gap;
    for (let i = 0; i < this.heartSlots; i++) {
      const cx = firstX + i * gap;
      const cy = 34;
      if (i < this.lives) {
        const t = this.time - (this.heartGainedAt[i] ?? -99);
        if (t < 0.5) {
          const k = t / 0.5;
          const s = k < 0.6 ? (k / 0.6) * 1.35 : 1.35 - ((k - 0.6) / 0.4) * 0.35;
          ctx.save();
          ctx.translate(cx, cy);
          ctx.scale(Math.max(0.01, s), Math.max(0.01, s));
          drawHeart(ctx, 0, 0, size, "#e8333f", "#8e1621");
          ctx.restore();
        } else {
          drawHeart(ctx, cx, cy, size, "#e8333f", "#8e1621");
        }
        continue;
      }
      // Lost heart: gray outline, plus the breaking animation for a moment
      const t = this.time - (this.heartLostAt[i] ?? -99);
      const k = Math.min(1, t / CONFIG.HEART_BREAK_TIME);
      ctx.globalAlpha = 0.35 + 0.65 * k;
      drawHeart(ctx, cx, cy, size, null, "#9a9a9a");
      ctx.globalAlpha = 1;
      if (k < 1) {
        // The two halves pop up a little, crack apart, tilt and fade out
        const pop = k < 0.2 ? 1 + k * 1.5 : 1.3 - (k - 0.2) * 0.5;
        const spread = k * 14, tilt = k * 0.6, drop = k * k * 18;
        for (const side of [-1, 1]) {
          ctx.save();
          ctx.globalAlpha = 1 - k;
          ctx.translate(cx + side * spread, cy + drop);
          ctx.rotate(side * tilt);
          ctx.scale(pop, pop);
          ctx.beginPath();
          // Clip to one half along a zigzag crack line
          ctx.moveTo(0, -size);
          ctx.lineTo(side * size, -size);
          ctx.lineTo(side * size, size);
          ctx.lineTo(0, size);
          ctx.lineTo(side * 3, size * 0.2);
          ctx.lineTo(-side * 3, 0);
          ctx.lineTo(side * 3, -size * 0.25);
          ctx.closePath();
          ctx.clip();
          drawHeart(ctx, 0, 0, size, "#e8333f", "#8e1621");
          ctx.restore();
        }
      }
    }
  }

  drawTitle(ctx) {
    drawText(ctx, "Bamboo Run", 520, 72, 64, "#ffffff", { stroke: "#2f6b1a", strokeWidth: 10 });
    drawBambooStalk(ctx, 318, 48, 46);
    drawBambooStalk(ctx, 722, 48, 46);
    drawPanel(ctx, 320, 120, 400, 170);
    drawText(ctx, `↑ Jump,  ↓ Duck,  collect ${CONFIG.WIN_TARGET} ${this.character.collectible.many}!`, 520, 152, 19, "#2f5d1a");
    drawText(ctx, "Jump over rocks  •  Duck under branches", 520, 184, 15, "#555");
    drawText(ctx, `Hold ↓ in the air to drop faster  •  ${CONFIG.START_LIVES} lives`, 520, 206, 15, "#555");
    drawText(ctx, "P / Esc pause  •  M mute  •  H hitboxes  •  O gallery", 520, 228, 13, "#777");
    if (Math.floor(this.time * 2) % 2 === 0) {
      drawText(ctx, "Press Space to Start", 520, 264, 24, "#d35400");
    }
  }

  drawPaused(ctx) {
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
    drawPanel(ctx, 250, 130, 300, 110);
    drawText(ctx, "Paused", 400, 168, 36, "#2f5d1a");
    drawText(ctx, "Press P to resume", 400, 210, 18, "#555");
  }

  drawGameOver(ctx) {
    const many = this.character.collectible.many;
    drawPanel(ctx, 150, 60, 500, 200);
    drawText(ctx, `Oops! ${capitalize(this.character.the)} ${this.hitMessage}!`, 400, 95, 21, "#c0392b");
    drawText(ctx, `${capitalize(many)} this run: ${this.count}`, 400, 135, 20, this.character.accent);
    drawText(ctx, `Best this session: ${this.bestScore}`, 400, 165, 18, "#555");
    if (this.time - this.endTime > CONFIG.RESTART_DELAY && Math.floor(this.time * 2) % 2 === 0) {
      drawText(ctx, "Press Space to try again", 400, 207, 20, "#d35400");
    }
    drawText(ctx, "C: choose another character", 400, 238, 14, "#777");
  }

  drawWin(ctx) {
    drawPanel(ctx, 150, 60, 500, 196);
    drawText(ctx, "🎉", 400, 90, 26, "#000");
    drawText(ctx, `You collected ${CONFIG.WIN_TARGET} ${this.character.collectible.many}! You win!`, 400, 128, 21, this.character.accent);
    drawText(ctx, `Best this session: ${this.bestScore}`, 400, 160, 17, "#555");
    if (this.time - this.endTime > CONFIG.RESTART_DELAY && Math.floor(this.time * 2) % 2 === 0) {
      drawText(ctx, "Press Space to play again", 400, 200, 20, "#d35400");
    }
    drawText(ctx, "C: choose another character", 400, 232, 14, "#777");
  }

  // Hitbox outlines (press H)
  drawDebug(ctx) {
    ctx.lineWidth = 1.5;
    const outline = (b, color) => { ctx.strokeStyle = color; ctx.strokeRect(b.x, b.y, b.w, b.h); };
    outline(this.panda.getHitbox(), "#00c853");
    for (const o of this.obstacles) for (const b of o.getHitboxes()) outline(b, "#ff1744");
    for (const b of this.bamboos) outline(b.getHitbox(), "#ffab00");
    for (const h of this.pickups) outline(h.getHitbox(), "#ff4fa3");
    drawText(ctx, `DEBUG  speed ${Math.round(this.speed)} px/s  fps ${Math.round(this.fps)}`,
      CONFIG.WIDTH - 14, 66, 12, "#b00020", { align: "right" });
  }

  // Character Select: three cards, the highlighted one glows and bounces.
  drawSelect(ctx) {
    this.background.draw(ctx, this.palette);
    ctx.fillStyle = "rgba(20,40,20,0.25)";
    ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
    drawText(ctx, "Choose your runner", 400, 34, 32, "#ffffff", { stroke: "#2f6b1a", strokeWidth: 8 });
    CHARACTERS.forEach((c, i) => {
      const r = this.selectCard(i);
      const on = i === this.selectIndex;
      const cx = r.x + r.w / 2;
      ctx.save();
      if (on) {
        ctx.shadowColor = "#ffd23f";
        ctx.shadowBlur = 22 + Math.sin(this.time * 5) * 6;
      }
      roundRectPath(ctx, r.x, r.y, r.w, r.h, 18);
      ctx.fillStyle = on ? "rgba(255,253,240,0.97)" : "rgba(255,253,240,0.75)";
      ctx.fill();
      ctx.restore();
      roundRectPath(ctx, r.x, r.y, r.w, r.h, 18);
      ctx.lineWidth = on ? 4 : 2;
      ctx.strokeStyle = on ? "#f0b400" : "rgba(76,138,46,0.6)";
      ctx.stroke();
      drawText(ctx, String(i + 1), r.x + 18, r.y + 20, 14, "#999");
      // Little patch of grass to stand on
      ellipse(ctx, cx, r.y + 196, 60, 8, 0, "rgba(95,156,58,0.35)");
      const hop = on ? Math.abs(Math.sin(this.time * 5)) * 10 : 0;
      ctx.save();
      ctx.translate(cx, r.y + 196 - hop);
      ctx.scale(1.3, 1.3);
      c.poses.idle(ctx, this.time + i * 0.7);
      ctx.restore();
      drawText(ctx, c.name, cx, r.y + 222, 22, c.accent);
      // "collects ..." line with the collectible icon just left of the text
      const label = `collects ${c.collectible.many}`;
      ctx.font = `bold 14px ${CONFIG.FONT}`;
      const tw = ctx.measureText(label).width;
      c.drawCollectible(ctx, cx - (tw + 16) / 2 + 4, r.y + 236, 22, this.time, i);
      drawText(ctx, label, cx + 8, r.y + 247, 14, "#555");
    });
    drawText(ctx, "← → to choose, Space to start", 400, 356, 20, "#ffffff", { stroke: "#2f5d1a", strokeWidth: 5 });
    drawText(ctx, "or press 1 / 2 / 3, or click a character", 400, 381, 13, "#ffffff", { stroke: "#2f5d1a", strokeWidth: 4 });
  }

  // The "O" gallery: one item at a time, in its zone's scenery, with hitboxes.
  drawShowcase(ctx) {
    const z = ZONES[this.showcaseZone] || ZONES[0];
    this.background.draw(ctx, blendPalettes(z, z, 0));
    const item = this.showcaseItem;
    const total = OBSTACLE_TYPES.length + 1 + CHARACTERS.length;
    const outline = (b, color) => { ctx.lineWidth = 1.5; ctx.strokeStyle = color; ctx.strokeRect(b.x, b.y, b.w, b.h); };
    if (item.characterPage) {
      this.drawCharacterPage(ctx, item.characterPage, total, outline);
      return;
    }
    item.draw(ctx, this.time);
    this.panda.draw(ctx, "idle", this.time, this.character); // for size comparison
    ctx.lineWidth = 1.5;
    outline(this.panda.getHitbox(), "#00c853");
    if (item instanceof HeartPickup) outline(item.getHitbox(), "#ff4fa3");
    else for (const b of item.getHitboxes()) outline(b, "#ff1744");

    drawPanel(ctx, 12, 10, 330, 124);
    let title, line2, line3, line4;
    if (item instanceof HeartPickup) {
      title = "Heart pickup";
      line2 = `Extra life, up to ${CONFIG.MAX_LIVES} hearts`;
      line3 = `Only when below ${CONFIG.MAX_LIVES} hearts`;
      line4 = `At most every ${CONFIG.HEART_MIN_BAMBOO_GAP} bamboo`;
    } else {
      const t = item.type;
      title = t.name;
      line2 = `${t.kind === "ground" ? "Ground: jump over" : "Overhead: duck under"}  •  ${t.category}`;
      line3 = `Zones: ${t.zones.join(", ")}`;
      line4 = `Appears from ${t.minBamboo} bamboo`;
    }
    drawText(ctx, `${this.showcaseIndex + 1} / ${total}   ${title}`, 26, 32, 16, "#2f5d1a", { align: "left" });
    drawText(ctx, line2, 26, 55, 13, "#555", { align: "left" });
    drawText(ctx, line3, 26, 74, 12, "#555", { align: "left" });
    drawText(ctx, line4, 26, 92, 12, "#555", { align: "left" });
    drawText(ctx, "O next  •  Shift+O back  •  Esc exit", 26, 116, 12, "#d35400", { align: "left" });
  }

  // Gallery page for one character: every pose with the shared hitbox,
  // plus its collectible (3 variants) with the shared collectible hitbox.
  drawCharacterPage(ctx, c, total, outline) {
    const gy = CONFIG.GROUND_Y, C = CONFIG;
    const poses = [
      ["run 1", (x) => c.poses.run(x, 0, this.time)], ["run 2", (x) => c.poses.run(x, 1, this.time)],
      ["run 3", (x) => c.poses.run(x, 2, this.time)], ["run 4", (x) => c.poses.run(x, 3, this.time)],
      ["jump", (x) => c.poses.jump(x, this.time), 50], ["duck", (x) => c.poses.duck(x, 0, this.time), 0, true],
      ["dizzy", (x) => c.poses.dizzy(x, this.time)], ["happy", (x) => c.poses.happy(x, this.time)],
    ];
    poses.forEach(([label, draw, lift = 0, duck = false], i) => {
      const x = 52 + i * 80, feet = gy - lift;
      ctx.save();
      ctx.translate(x, feet);
      draw(ctx);
      ctx.restore();
      const w = duck ? C.PANDA_DUCK_WIDTH : C.PANDA_WIDTH, h = duck ? C.PANDA_DUCK_HEIGHT : C.PANDA_HEIGHT;
      outline(insetBox(x - w / 2, feet - h, w, h), "#00c853");
      drawText(ctx, label, x, gy + 22, 12, "#ffffff", { stroke: "#333", strokeWidth: 3 });
    });
    for (let v = 0; v < 3; v++) {
      const bx = 700 + v * 30;
      c.drawCollectible(ctx, bx, gy - C.BAMBOO_GROUND_HEIGHT - C.BAMBOO_HEIGHT, C.BAMBOO_HEIGHT, this.time, v);
      outline(insetBox(bx - C.BAMBOO_WIDTH / 2, gy - C.BAMBOO_GROUND_HEIGHT - C.BAMBOO_HEIGHT, C.BAMBOO_WIDTH, C.BAMBOO_HEIGHT), "#ffab00");
    }
    drawText(ctx, c.collectible.many, 730, gy + 22, 12, "#ffffff", { stroke: "#333", strokeWidth: 3 });
    drawPanel(ctx, 12, 10, 330, 124);
    drawText(ctx, `${this.showcaseIndex + 1} / ${total}   ${c.name}: every pose`, 26, 32, 16, c.accent, { align: "left" });
    drawText(ctx, `Collects ${c.collectible.many}`, 26, 55, 13, "#555", { align: "left" });
    drawText(ctx, "Green: shared player hitbox (same for all)", 26, 74, 12, "#555", { align: "left" });
    drawText(ctx, "Orange: shared collectible hitbox", 26, 92, 12, "#555", { align: "left" });
    drawText(ctx, "O next  •  Shift+O back  •  Esc exit", 26, 116, 12, "#d35400", { align: "left" });
  }
}


/* =====================================================================
   Self-check: verify with plain math that the level design is fair.
   Results are printed in the browser console (F12).
   ===================================================================== */
function runSelfChecks() {
  const C = CONFIG;
  const results = [];
  const peak = (C.JUMP_VELOCITY ** 2) / (2 * C.GRAVITY);
  const standing = insetBox(0, C.GROUND_Y - C.PANDA_HEIGHT, C.PANDA_WIDTH, C.PANDA_HEIGHT);
  const ducking = insetBox(0, C.GROUND_Y - C.PANDA_DUCK_HEIGHT, C.PANDA_DUCK_WIDTH, C.PANDA_DUCK_HEIGHT);
  const feetInset = C.GROUND_Y - (standing.y + standing.h); // hitbox bottom sits this far above the feet

  const airTime = (2 * C.JUMP_VELOCITY) / C.GRAVITY;
  const lowBamboo = insetBox(0, C.GROUND_Y - C.BAMBOO_GROUND_HEIGHT - C.BAMBOO_HEIGHT, C.BAMBOO_WIDTH, C.BAMBOO_HEIGHT);
  const lowHeart = insetBox(0, C.GROUND_Y - C.BAMBOO_GROUND_HEIGHT - 24, 26, 24);
  let lowestOverhead = 0;

  // Build many random copies of every registry entry and check each one.
  for (const type of OBSTACLE_TYPES) {
    let ok = true, detail = "", worst = -Infinity; // report the hardest copy
    for (let i = 0; i < 60; i++) {
      const o = new Obstacle(type, 0);
      o.age = Math.random() * 10; // birds bob over time
      const raw = type.boxes(o);
      const boxes = o.getHitboxes();
      if (type.kind === "ground") {
        // Jump over: is the panda high enough for long enough at top speed?
        const rawHeight = C.GROUND_Y - Math.min(...raw.map((b) => b.y));
        const top = Math.min(...boxes.map((b) => b.y));
        const span = Math.max(...boxes.map((b) => b.x + b.w)) - Math.min(...boxes.map((b) => b.x));
        const needH = Math.max(0, C.GROUND_Y - top - feetInset);
        const timeAbove = (2 * Math.sqrt(C.JUMP_VELOCITY ** 2 - 2 * C.GRAVITY * needH)) / C.GRAVITY;
        const timeNeeded = (standing.w + span) / C.MAX_SPEED;
        // Require 1.5x the minimum so the take-off point is comfortable, not pixel-perfect
        const good = rawHeight <= C.GROUND_OBSTACLE_MAX_HEIGHT && needH < peak && timeAbove > timeNeeded * 1.5;
        const hardness = good ? timeNeeded / timeAbove : Infinity;
        if (hardness > worst) {
          worst = hardness;
          detail = `hardest: height ${rawHeight.toFixed(0)}px, width ${o.w}px, airborne ${timeAbove.toFixed(2)}s vs needed ${timeNeeded.toFixed(2)}s`;
        }
        if (!good) ok = false;
      } else {
        // Duck under: everything solid ends above the ducking panda's head,
        // and something solid is low enough to hit a standing panda.
        const rawBottom = Math.max(...raw.map((b) => b.y + b.h));
        const bottom = Math.max(...boxes.map((b) => b.y + b.h));
        lowestOverhead = Math.max(lowestOverhead, bottom);
        const good = rawBottom <= C.GROUND_Y - C.BRANCH_CLEARANCE && ducking.y >= bottom && standing.y < bottom;
        const hardness = good ? bottom : Infinity;
        if (hardness > worst) {
          worst = hardness;
          detail = `lowest solid point ${bottom.toFixed(1)}, ducking top ${ducking.y.toFixed(1)}, standing top ${standing.y.toFixed(1)}`;
        }
        if (!good) ok = false;
      }
    }
    results.push({ check: `${type.name}: ${type.kind === "ground" ? "jumpable" : "duckable"}`, ok, detail });
  }

  // Rewards placed under overhead obstacles must not touch them
  results.push({ check: "under-branch bamboo / heart clear of overhead hazards",
    ok: lowBamboo.y > lowestOverhead && lowHeart.y > lowestOverhead,
    detail: `bamboo top ${lowBamboo.y.toFixed(1)}, heart top ${lowHeart.y.toFixed(1)} > hazard bottom ${lowestOverhead.toFixed(1)}` });

  // Minimum gap leaves time to land from a jump before the next obstacle
  results.push({ check: "minimum gap > jump air time", ok: C.MIN_OBSTACLE_GAP > airTime,
    detail: `gap ${C.MIN_OBSTACLE_GAP}s vs air time ${airTime.toFixed(2)}s` });

  const allOk = results.every((r) => r.ok);
  if (typeof console !== "undefined") {
    (allOk ? console.log : console.warn)(`Bamboo Run self-checks: ${allOk ? "all passed" : "SOME FAILED"}`);
    if (console.table) console.table(results);
  }
  return { allOk, results };
}


/* =====================================================================
   9. Startup: canvas scaling, input and the main loop
   ===================================================================== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const sound = new Sound();
const game = new Game(sound);
window.bambooRun = { game, CONFIG, runSelfChecks }; // handy for tinkering in the console

// Scale the 800x400 game to fit the window while keeping its shape.
// The canvas backing store also accounts for high-DPI screens so it stays sharp.
function resize() {
  const scale = Math.min(window.innerWidth / CONFIG.WIDTH, window.innerHeight / CONFIG.HEIGHT);
  const cssW = Math.floor(CONFIG.WIDTH * scale);
  const cssH = Math.floor(CONFIG.HEIGHT * scale);
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";
  canvas.width = Math.max(1, Math.round(cssW * dpr));
  canvas.height = Math.max(1, Math.round(cssH * dpr));
}
window.addEventListener("resize", resize);
resize();

// Keyboard
const BLOCKED_KEYS = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Spacebar"];
window.addEventListener("keydown", (e) => {
  if (BLOCKED_KEYS.includes(e.key) || e.code === "Space") e.preventDefault(); // stop page scrolling
  sound.unlock(); // audio may only start after a user gesture
  game.onKeyDown(e);
});
window.addEventListener("keyup", (e) => game.onKeyUp(e));

// Mouse / touch: click a character on the Character Select screen
canvas.addEventListener("pointerdown", (e) => {
  sound.unlock();
  const r = canvas.getBoundingClientRect();
  game.onClick(((e.clientX - r.left) / r.width) * CONFIG.WIDTH, ((e.clientY - r.top) / r.height) * CONFIG.HEIGHT);
  canvas.focus();
});

// Auto-pause when the tab or window loses focus
window.addEventListener("blur", () => game.onBlur());
document.addEventListener("visibilitychange", () => { if (document.hidden) game.onBlur(); });

// Main loop. Movement uses delta time (seconds since the last frame), so the
// game runs at the same speed on 60Hz, 120Hz or 144Hz screens. Long frames are
// split into small steps so fast objects never skip through each other.
const MAX_FRAME_TIME = 0.1;   // ignore huge gaps (e.g. after switching tabs)
const STEP = 1 / 120;         // largest physics step
let lastTime = null;

function frame(now) {
  if (lastTime === null) lastTime = now;
  let dt = Math.min(MAX_FRAME_TIME, (now - lastTime) / 1000);
  lastTime = now;
  if (dt > 0) game.fps = game.fps * 0.95 + (1 / dt) * 0.05;

  while (dt > 0) {
    const step = Math.min(STEP, dt);
    game.update(step);
    dt -= step;
  }

  // Draw in 800x400 "game units", scaled to the real canvas size
  ctx.setTransform(canvas.width / CONFIG.WIDTH, 0, 0, canvas.height / CONFIG.HEIGHT, 0, 0);
  game.draw(ctx);
  requestAnimationFrame(frame);
}

runSelfChecks();
canvas.focus();
requestAnimationFrame(frame);
</script>
