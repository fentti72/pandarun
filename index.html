<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bamboo Run</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1d2b1f;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    border-radius: 6px;
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    outline: none;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="400" tabindex="0" aria-label="Bamboo Run game"></canvas>

<script>
"use strict";

/* =====================================================================
   BAMBOO RUN
   A tiny endless-runner starring a panda. Everything (graphics, sound,
   logic) lives in this one file. Open it in a browser to play.

   Sections:
     1. CONFIG          - every number you might want to tweak
     2. Helpers         - small math / drawing utilities
     3. Sound           - beeps made with the Web Audio API
     4. Panda           - the player: physics, hitbox and drawing
     5. Obstacle        - rocks (jump over) and branches (duck under)
     6. Bamboo          - the collectibles
     7. Background      - parallax sky, mountains, forest and ground
     8. Game            - state machine, spawning, collisions, UI
     9. Startup         - canvas scaling, keyboard input, main loop
   ===================================================================== */


/* =====================================================================
   1. CONFIG - all tunable values in one place
   Units: pixels, seconds, and pixels-per-second (px/s).
   ===================================================================== */
const CONFIG = {
  // --- Canvas / world ---
  WIDTH: 800,                // internal drawing width (scaled to fit window)
  HEIGHT: 400,               // internal drawing height
  GROUND_Y: 340,             // y coordinate of the ground surface

  // --- Goal ---
  WIN_TARGET: 50,            // bamboo sticks needed to win

  // --- Panda size & physics ---
  PANDA_X: 170,              // fixed horizontal position (left third of screen)
  PANDA_WIDTH: 56,           // drawn width while standing / running
  PANDA_HEIGHT: 76,          // drawn height while standing / running
  PANDA_DUCK_WIDTH: 66,      // drawn width while ducking (wider, squashed)
  PANDA_DUCK_HEIGHT: 42,     // drawn height while ducking (clearly shorter)
  GRAVITY: 2200,             // downward acceleration (px/s^2)
  JUMP_VELOCITY: 820,        // upward speed at the start of a jump (px/s)
  FAST_DROP_MULTIPLIER: 3.2, // gravity multiplier while holding Down in the air
  JUMP_BUFFER_TIME: 0.12,    // a jump pressed this long before landing still counts
  RUN_ANIM_FPS: 12,          // leg animation speed at the starting scroll speed

  // --- Scroll speed / difficulty ---
  START_SPEED: 320,          // starting scroll speed (px/s)
  SPEED_STEP: 40,            // speed added at each difficulty step
  SPEED_STEP_EVERY: 10,      // a difficulty step happens every N bamboo
  MAX_SPEED: 560,            // speed never goes above this
  TITLE_SCROLL_SPEED: 60,    // gentle background scroll on the title screen

  // --- Obstacle spawning (all gaps are measured in seconds of travel time) ---
  FIRST_OBSTACLE_DELAY: 1.8, // seconds before the very first obstacle
  MIN_OBSTACLE_GAP: 1.0,     // GUARANTEED minimum time between two obstacles
  MIXED_GAP_BONUS: 0.3,      // extra time when a rock and a branch follow each other
  RANDOM_GAP: 1.2,           // up to this much random extra time between obstacles
  RANDOM_GAP_SHRINK: 0.15,   // random extra shrinks by this much per difficulty step
  RANDOM_GAP_MIN: 0.35,      // ...but never below this
  OVERHEAD_CHANCE: 0.4,      // probability that an obstacle is overhead (duck) rather than ground (jump)
  GROUND_OBSTACLE_MAX_HEIGHT: 36, // safe height limit for anything you jump over

  // --- Rocks ---
  ROCK_SIZES: [              // small and medium; all are jumpable (checked at startup)
    { w: 34, h: 26 },
    { w: 40, h: 31 },
    { w: 46, h: 36 },
  ],

  // --- New hazards ---
  LAVA_MIN_WIDTH: 60,        // narrowest lava pit
  LAVA_MAX_WIDTH: 110,       // widest lava pit (checked to be jumpable at top speed)
  BIRD_EXTRA_SPEED: 70,      // birds fly this much faster than the ground scrolls (px/s)

  // --- Zones (spring -> autumn -> snow -> desert -> volcano) ---
  ZONES_ENABLED: true,       // false = spring scenery and all obstacle styles mixed together
  ZONE_EVERY: 10,            // a new zone every N bamboo
  ZONE_FADE_TIME: 2.5,       // seconds for the background colors to fade to the new zone

  // --- Branches (and every other overhead hazard) ---
  BRANCH_WIDTH: 110,         // horizontal size of the leafy branch
  BRANCH_THICKNESS: 40,      // vertical size of the leafy part (its hitbox)
  BRANCH_CLEARANCE: 50,      // gap between ground and the lowest leaves

  // --- Bamboo ---
  BAMBOO_WIDTH: 16,
  BAMBOO_HEIGHT: 40,
  BAMBOO_GROUND_HEIGHT: 3,   // bottom of ground bamboo above the ground
  BAMBOO_MID_HEIGHT: 95,     // bottom of "mid-jump" bamboo above the ground
  BAMBOO_REWARD_HEIGHT: 125, // bottom of the reward stick floating over a rock
  ROCK_REWARD_CHANCE: 0.55,  // chance a rock gets a reward stick above it
  BRANCH_REWARD_CHANCE: 0.45,// chance a branch gets a low stick under it (duck to grab)
  BAMBOO_OBSTACLE_MARGIN: 70,// bamboo patterns keep at least this far from obstacles
  BAMBOO_PATTERN_SPACING: 36,// distance between sticks in a row

  // --- Collision ---
  HITBOX_INSET: 0.12,        // hitboxes are 12% smaller than the drawing (6% per side)

  // --- Lives ---
  START_LIVES: 2,            // hearts at the start of each game
  MAX_LIVES: 3,              // heart pickups can raise lives up to this
  HEART_SPAWN_CHANCE: 0.25,  // chance per obstacle of a heart pickup (once the gap below has passed)
  HEART_MIN_BAMBOO_GAP: 15,  // at least this many bamboo between heart pickups
  INVINCIBLE_TIME: 2.0,      // seconds of invincibility after losing a heart
  INVINCIBLE_FLASH_HZ: 8,    // how many times per second the panda blinks while invincible
  HEART_BREAK_TIME: 0.6,     // length of the "heart breaks" animation (seconds)

  // --- Music ---
  MUSIC_VOLUME: 0.35,        // music loudness (sound effects are at 1.0)
  MUSIC_BPM: 152,            // tempo of the background tune
  MUSIC_DUCK_AMOUNT: 0.2,    // music drops to this fraction while "ouch" plays
  MUSIC_DUCK_TIME: 0.5,      // ...for this many seconds
  MUSIC_LOOKAHEAD_MS: 25,    // how often the scheduler wakes up (milliseconds)
  MUSIC_SCHEDULE_AHEAD: 0.12,// how far ahead notes are scheduled on the audio clock (seconds)

  // --- Parallax speed factors (1 = same speed as obstacles) ---
  PARALLAX_FAR: 0.08,
  PARALLAX_MOUNTAINS: 0.15,
  PARALLAX_FOREST: 0.4,
  PARALLAX_GROUND: 1.0,

  // --- Misc ---
  RESTART_DELAY: 0.5,        // seconds before Space can restart after win / loss
  FONT: "'Trebuchet MS', 'Segoe UI', Verdana, sans-serif",
};


/* =====================================================================
   2. Helpers
   ===================================================================== */

// Random number between a and b.
const rand = (a, b) => a + Math.random() * (b - a);
// Random integer between a and b (both included).
const randInt = (a, b) => Math.floor(rand(a, b + 1));
// Random element of an array.
const choose = (arr) => arr[Math.floor(Math.random() * arr.length)];

// A repeatable random number generator. The background uses it so the
// scenery looks the same every time you load the page.
function seededRandom(seed) {
  return function () {
    seed = (seed * 16807) % 2147483647;
    return (seed - 1) / 2147483646;
  };
}

// Make a hitbox that is HITBOX_INSET smaller than the drawn box, keeping it
// centred. Smaller hitboxes make near-misses feel fair instead of frustrating.
function insetBox(x, y, w, h) {
  const ix = (w * CONFIG.HITBOX_INSET) / 2;
  const iy = (h * CONFIG.HITBOX_INSET) / 2;
  return { x: x + ix, y: y + iy, w: w - 2 * ix, h: h - 2 * iy };
}

// Axis-aligned bounding box (AABB) overlap test: true if rectangles touch.
function overlaps(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

// Draw a filled (and optionally outlined) ellipse.
function ellipse(ctx, x, y, rx, ry, rotation, fill, stroke, lineWidth) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rotation || 0, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.lineWidth = lineWidth || 2; ctx.strokeStyle = stroke; ctx.stroke(); }
}

// Build a rounded-rectangle path (call fill() / stroke() afterwards).
function roundRectPath(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

const capitalize = (s) => s.charAt(0).toUpperCase() + s.slice(1);

// Draw text with an optional outline, centred by default.
function drawText(ctx, text, x, y, size, color, options = {}) {
  ctx.font = `${options.weight || "bold"} ${size}px ${CONFIG.FONT}`;
  ctx.textAlign = options.align || "center";
  ctx.textBaseline = "middle";
  if (options.stroke) {
    ctx.lineJoin = "round";
    ctx.lineWidth = options.strokeWidth || 4;
    ctx.strokeStyle = options.stroke;
    ctx.strokeText(text, x, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

// A soft, rounded panel used behind menu text.
function drawPanel(ctx, x, y, w, h) {
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.25)";
  ctx.shadowBlur = 12;
  ctx.shadowOffsetY = 4;
  roundRectPath(ctx, x, y, w, h, 18);
  ctx.fillStyle = "rgba(255, 253, 240, 0.93)";
  ctx.fill();
  ctx.restore();
  roundRectPath(ctx, x, y, w, h, 18);
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#4c8a2e";
  ctx.stroke();
}

// Five-pointed star (used for sparkles and dizzy stars).
function drawStar(ctx, x, y, r, color) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const radius = i % 2 === 0 ? r : r * 0.45;
    const a = -Math.PI / 2 + (i * Math.PI) / 5;
    ctx.lineTo(x + Math.cos(a) * radius, y + Math.sin(a) * radius);
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

// A heart centred on (cx, cy). size is its full width. Pass null to skip fill.
function drawHeart(ctx, cx, cy, size, fill, stroke) {
  const s = size / 2;
  ctx.beginPath();
  ctx.moveTo(cx, cy + s * 0.9);
  ctx.bezierCurveTo(cx - s * 1.3, cy + s * 0.05, cx - s * 0.9, cy - s * 1.05, cx, cy - s * 0.4);
  ctx.bezierCurveTo(cx + s * 0.9, cy - s * 1.05, cx + s * 1.3, cy + s * 0.05, cx, cy + s * 0.9);
  ctx.closePath();
  if (fill) {
    ctx.fillStyle = fill;
    ctx.fill();
  }
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = stroke;
  ctx.stroke();
  if (fill) ellipse(ctx, cx - s * 0.42, cy - s * 0.35, s * 0.18, s * 0.11, -0.6, "rgba(255,255,255,0.6)"); // shine
}

// Draw one bamboo stalk. (cx, top) is the top-centre; h is its height.
// Shared by the collectible sticks and the HUD icon.
function drawBambooStalk(ctx, cx, top, h) {
  const sw = h * 0.23; // stalk width
  // Leaves (drawn first so the stalk sits on top of them)
  ellipse(ctx, cx + sw * 1.1, top + h * 0.3, sw * 0.95, sw * 0.32, -0.55, "#5fb83a");
  ellipse(ctx, cx - sw * 1.0, top + h * 0.62, sw * 0.85, sw * 0.3, 0.55, "#4fa52f");
  // The stalk, with a left-to-right gradient so it looks round
  const g = ctx.createLinearGradient(cx - sw / 2, 0, cx + sw / 2, 0);
  g.addColorStop(0, "#a6e07a");
  g.addColorStop(0.5, "#6fbf45");
  g.addColorStop(1, "#3f8a24");
  roundRectPath(ctx, cx - sw / 2, top, sw, h, sw * 0.35);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.lineWidth = 1.2;
  ctx.strokeStyle = "#2f6b1a";
  ctx.stroke();
  // Segment joints ("nodes")
  ctx.fillStyle = "#2f6b1a";
  for (const f of [0.33, 0.66]) {
    roundRectPath(ctx, cx - sw / 2 - 1, top + h * f - 1.3, sw + 2, 2.6, 1.2);
    ctx.fill();
  }
}


/* =====================================================================
   3. Sound - synthesized sound effects and music (no audio files needed)
   Browsers only allow audio after the user interacts with the page, so
   the AudioContext is created on the first key press (see unlock()).

   Audio routing:   sound effects --> sfxBus   --\
                    music notes   --> musicBus --+--> master --> speakers
   Muting sets the master volume to 0, which silences everything at once.
   ===================================================================== */
class Sound {
  constructor() {
    this.ctx = null;
    this.muted = false;
    this.music = new Music(this);
  }

  // Called on every key press; creates/resumes audio the first time.
  unlock() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      try { this.ctx = new AudioCtx(); } catch (e) { return; }
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 1;
      this.master.connect(this.ctx.destination);
      this.sfxBus = this.ctx.createGain();
      this.sfxBus.connect(this.master);
      this.musicBus = this.ctx.createGain();
      this.musicBus.gain.value = 0; // silent until the music starts
      this.musicBus.connect(this.master);
      // One second of white noise, reused for the hi-hat "tick"
      const len = this.ctx.sampleRate;
      this.noiseBuffer = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noiseBuffer.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    }
    if (this.ctx.state === "suspended") this.ctx.resume();
  }

  // M key: mute / unmute music and sound effects together.
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.setTargetAtTime(this.muted ? 0 : 1, this.ctx.currentTime, 0.01);
  }

  // Play one tone that slides from freq to endFreq and fades out.
  tone(freq, endFreq, duration, type = "sine", volume = 0.2, delay = 0) {
    if (!this.ctx || this.muted) return;
    const t0 = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (endFreq !== freq) osc.frequency.exponentialRampToValueAtTime(endFreq, t0 + duration);
    gain.gain.setValueAtTime(volume, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.connect(gain).connect(this.sfxBus);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }

  // Cartoon "oww!": a sliding tone with a fast wobble (vibrato), softened
  // by a low-pass filter. The music dips so it stands out. Each character
  // passes its own settings (see CHARACTERS: panda "oww", dog yelp,
  // unicorn whinny). mid = optional pitch to rise to before falling.
  ouch(o = CHARACTERS[0].ouch) {
    if (!this.ctx || this.muted) return;
    const t0 = this.ctx.currentTime;
    const dur = o.dur;
    const osc = this.ctx.createOscillator();
    osc.type = o.type;
    osc.frequency.setValueAtTime(o.from, t0);
    if (o.mid) osc.frequency.exponentialRampToValueAtTime(o.mid, t0 + dur * 0.25);
    osc.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
    // Wobble: a second, slow oscillator nudges the pitch up and down
    const lfo = this.ctx.createOscillator();
    const lfoDepth = this.ctx.createGain();
    lfo.frequency.value = o.wobbleHz;
    lfoDepth.gain.value = o.wobbleDepth;
    lfo.connect(lfoDepth).connect(osc.frequency);
    const filter = this.ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = o.filter;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.001, t0);
    gain.gain.exponentialRampToValueAtTime(0.3, t0 + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(filter).connect(gain).connect(this.sfxBus);
    osc.start(t0); lfo.start(t0);
    osc.stop(t0 + dur + 0.02); lfo.stop(t0 + dur + 0.02);
    this.music.duck();
  }

  jump()    { this.tone(260, 640, 0.18, "sine", 0.25); }                    // "boing"
  // Collect sound: "ding" (bamboo), "bark" (bones), "chime" (crystals)
  collect(style = "ding") {
    if (style === "bark") {           // short bark-like blip, then a ding
      this.tone(560, 300, 0.07, "square", 0.11);
      this.tone(620, 340, 0.06, "square", 0.08, 0.08);
      this.tone(1320, 1320, 0.1, "triangle", 0.12, 0.12);
    } else if (style === "chime") {   // sparkly rising chime
      [1568, 2093, 2637].forEach((f, i) => this.tone(f, f, 0.14, "triangle", 0.12, i * 0.045));
      this.tone(3136, 3136, 0.25, "sine", 0.06, 0.13);
    } else {                          // the original "ding"
      this.tone(1320, 1320, 0.08, "triangle", 0.16);
      this.tone(1760, 1760, 0.16, "triangle", 0.14, 0.06);
    }
  }
  thud()    { this.tone(170, 45, 0.3, "square", 0.14);                       // "thud"
              this.tone(95, 40, 0.35, "sine", 0.4); }
  levelUp() { this.tone(660, 990, 0.15, "triangle", 0.12); }
  powerUp() {                                                                 // heart pickup
    [523, 659, 784, 1047].forEach((f, i) => this.tone(f, f * 1.02, 0.12, "square", 0.12, i * 0.06));
    this.tone(1568, 2093, 0.25, "triangle", 0.12, 0.24);
  }

  // Lava "sssss": filtered noise sweeping down, layered on top of the ouch.
  sizzle() {
    if (!this.ctx || this.muted) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuffer;
    const filter = this.ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.Q.value = 1.2;
    filter.frequency.setValueAtTime(5000, t0);
    filter.frequency.exponentialRampToValueAtTime(900, t0 + 0.55);
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.001, t0);
    gain.gain.exponentialRampToValueAtTime(0.35, t0 + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.6);
    src.connect(filter).connect(gain).connect(this.sfxBus);
    src.start(t0, 0, 0.62);
  }
  win() {                                                                     // jingle
    const notes = [523, 659, 784, 1047, 784, 1047];
    notes.forEach((f, i) => this.tone(f, f, i === notes.length - 1 ? 0.45 : 0.14, "triangle", 0.2, i * 0.13));
  }
}


/* ---------------------------------------------------------------------
   Music - an original, bouncy 8-bit loop (16 bars in C major)
   Each bar has 8 slots (eighth notes). In the strings below:
     a note name like "E5" starts a note,  "-" holds the previous note,
     "." is a rest.
   Lead = square wave, bass = triangle wave, plus a soft noise "tick".
   --------------------------------------------------------------------- */
const SONG = {
  //        chord root for the bass, then the melody for that bar
  bars: [
    ["C3",  "E5 . G5 E5 C5 . D5 E5"],
    ["A2",  "C5 . A4 C5 E5 - . ."],
    ["F2",  "F5 . A5 F5 C5 . F5 A5"],
    ["G2",  "G5 - F5 E5 D5 - . ."],
    ["C3",  "E5 . G5 E5 C6 . B5 A5"],
    ["A2",  "G5 . E5 C5 A4 - . ."],
    ["F2",  "A4 C5 F5 A5 G5 F5 E5 D5"],
    ["G2",  "D5 - E5 . D5 - . ."],
    ["F2",  "A5 . A5 G5 F5 . A5 ."],
    ["G2",  "B5 . B5 A5 G5 . D5 ."],
    ["E2",  "G5 . E5 G5 B5 - A5 G5"],
    ["A2",  "A5 - . E5 C5 - . ."],
    ["F2",  "F5 . A5 C6 A5 . F5 ."],
    ["G2",  "G5 . B5 D6 B5 . G5 ."],
    ["C3",  "C6 . G5 E5 C5 . E5 G5"],
    ["G2",  "D5 - B4 . G4 . . ."],
  ],
};

// "A4" -> 440 Hz.  Works for natural notes and sharps like "F#4".
function noteToFreq(name) {
  const semis = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
  const m = /^([A-G])(#?)(\d)$/.exec(name);
  const n = semis[m[1]] + (m[2] ? 1 : 0) + (Number(m[3]) - 4) * 12;
  return 440 * Math.pow(2, n / 12);
}

// Turn the SONG text into a flat list of steps (one per eighth note).
function buildSongSteps() {
  const steps = [];
  for (const [root, melody] of SONG.bars) {
    const tokens = melody.trim().split(/\s+/);
    const rootFreq = noteToFreq(root);
    // Bouncy bass: root, fifth, octave, fifth on the four beats
    const bassPattern = [1, 0, 1.5, 0, 2, 0, 1.5, 0];
    for (let i = 0; i < 8; i++) {
      const tok = tokens[i];
      let lead = null;
      if (tok !== "-" && tok !== ".") {
        let len = 1; // count how many "-" holds follow
        while (tokens[i + len] === "-") len++;
        lead = { freq: noteToFreq(tok), len };
      }
      const bass = bassPattern[i] ? { freq: rootFreq * bassPattern[i], len: 1.6 } : null;
      steps.push({ lead, bass, beat: i % 2 === 0, downbeat: i === 0 || i === 4 });
    }
  }
  return steps;
}

class Music {
  constructor(sound) {
    this.sound = sound;
    this.steps = buildSongSteps();
    this.state = "stopped"; // "stopped" | "playing" | "paused"
    this.step = 0;          // which eighth note plays next
    this.nextTime = 0;      // audio-clock time of that note
    this.timer = null;
  }

  get stepLength() {
    return 60 / CONFIG.MUSIC_BPM / 2; // one eighth note, in seconds
  }

  // Start from the beginning of the song.
  start() {
    this.stop();
    if (!this.sound.ctx) return;
    this.step = 0;
    this.run();
  }

  pause() {
    if (this.state !== "playing") return;
    clearInterval(this.timer);
    this.timer = null;
    this.state = "paused";
    const ctx = this.sound.ctx;
    // Rewind past notes that were scheduled but have not sounded yet,
    // so resuming continues exactly where the music stopped.
    while (this.nextTime - this.stepLength > ctx.currentTime) {
      this.nextTime -= this.stepLength;
      this.step = (this.step - 1 + this.steps.length) % this.steps.length;
    }
    this.silence();
  }

  resume() {
    if (this.state === "paused" && this.sound.ctx) this.run();
  }

  stop() {
    clearInterval(this.timer);
    this.timer = null;
    if (this.state !== "stopped") this.silence();
    this.state = "stopped";
    this.step = 0;
  }

  // Briefly lower the music (used while "ouch" plays).
  duck() {
    if (this.state !== "playing") return;
    const g = this.sound.musicBus.gain, now = this.sound.ctx.currentTime;
    g.cancelScheduledValues(now);
    g.setTargetAtTime(CONFIG.MUSIC_VOLUME * CONFIG.MUSIC_DUCK_AMOUNT, now, 0.02);
    g.setTargetAtTime(CONFIG.MUSIC_VOLUME, now + CONFIG.MUSIC_DUCK_TIME, 0.1);
  }

  // ---- internals ----
  run() {
    const ctx = this.sound.ctx, g = this.sound.musicBus.gain;
    this.state = "playing";
    g.cancelScheduledValues(ctx.currentTime);
    g.setTargetAtTime(CONFIG.MUSIC_VOLUME, ctx.currentTime, 0.02);
    this.nextTime = ctx.currentTime + 0.06;
    this.schedule();
    // setInterval only wakes us up; the notes themselves are timed precisely
    // on the audio clock, so the tempo stays steady even if a timer is late.
    this.timer = setInterval(() => this.schedule(), CONFIG.MUSIC_LOOKAHEAD_MS);
  }

  silence() {
    const ctx = this.sound.ctx;
    if (!ctx) return;
    const g = this.sound.musicBus.gain;
    g.cancelScheduledValues(ctx.currentTime);
    g.setTargetAtTime(0, ctx.currentTime, 0.015);
  }

  // Schedule every note that falls inside the next MUSIC_SCHEDULE_AHEAD seconds.
  schedule() {
    const ctx = this.sound.ctx;
    while (this.nextTime < ctx.currentTime + CONFIG.MUSIC_SCHEDULE_AHEAD) {
      this.playStep(this.steps[this.step], this.nextTime);
      this.nextTime += this.stepLength;
      this.step = (this.step + 1) % this.steps.length;
    }
  }

  playStep(s, t) {
    const L = this.stepLength;
    if (s.lead) this.note("square", s.lead.freq, t, s.lead.len * L * 0.85, 0.16);
    if (s.bass) this.note("triangle", s.bass.freq, t, s.bass.len * L * 0.8, 0.45);
    // Light percussion: a short noise tick on every beat, louder on beats 1 and 3
    this.tick(t, s.downbeat ? 0.14 : s.beat ? 0.07 : 0.035);
  }

  note(type, freq, t, dur, vol) {
    const ctx = this.sound.ctx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.008);       // quick attack
    gain.gain.setTargetAtTime(vol * 0.6, t + 0.03, 0.05);        // settle
    gain.gain.setTargetAtTime(0.0001, t + dur - 0.02, 0.015);    // release
    osc.connect(gain).connect(this.sound.musicBus);
    osc.start(t);
    osc.stop(t + dur + 0.1);
  }

  tick(t, vol) {
    const ctx = this.sound.ctx;
    const src = ctx.createBufferSource();
    src.buffer = this.sound.noiseBuffer;
    const filter = ctx.createBiquadFilter();
    filter.type = "highpass";
    filter.frequency.value = 7000;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
    src.connect(filter).connect(gain).connect(this.sound.musicBus);
    src.start(t, Math.random() * 0.5, 0.05);
  }
}


/* =====================================================================
   4. Panda - the player
   (x, y) is the point between his feet. y === GROUND_Y means he is
   standing on the ground; smaller y means he is in the air.
   ===================================================================== */
const PANDA_BLACK = "#1f1f24";
const PANDA_WHITE = "#fbfbf8";

class Panda {
  constructor() {
    this.reset();
  }

  reset() {
    this.x = CONFIG.PANDA_X;
    this.y = CONFIG.GROUND_Y;
    this.vy = 0;              // vertical speed (negative = going up)
    this.onGround = true;
    this.wantsDuck = false;   // is the Down key held?
    this.jumpBuffer = 0;      // time left on a pending jump request
    this.animTime = 0;        // drives the running animation
  }

  // He only counts as ducking while on the ground.
  get isDucking() {
    return this.onGround && this.wantsDuck;
  }

  // Ask for a jump. It happens on the next update if he is on the ground
  // (or within JUMP_BUFFER_TIME once he lands). No double jumps.
  requestJump() {
    this.jumpBuffer = CONFIG.JUMP_BUFFER_TIME;
  }

  setDuck(held) {
    this.wantsDuck = held;
    // Fast-drop: pressing Down while still rising stops the rise right away.
    if (held && !this.onGround && this.vy < 0) this.vy = 0;
  }

  // Move the panda forward in time by dt seconds. Returns true if he jumped.
  update(dt, animSpeed = 1) {
    let jumped = false;
    this.animTime += dt * animSpeed;

    if (this.jumpBuffer > 0) {
      this.jumpBuffer -= dt;
      if (this.onGround) {
        this.vy = -CONFIG.JUMP_VELOCITY;
        this.onGround = false;
        this.jumpBuffer = 0;
        jumped = true;
      }
    }

    if (!this.onGround) {
      // Gravity pulls him down; holding Down makes gravity stronger (fast-drop).
      let g = CONFIG.GRAVITY;
      if (this.wantsDuck) g *= CONFIG.FAST_DROP_MULTIPLIER;
      this.vy += g * dt;
      this.y += this.vy * dt;
      // Land on the ground
      if (this.y >= CONFIG.GROUND_Y) {
        this.y = CONFIG.GROUND_Y;
        this.vy = 0;
        this.onGround = true;
      }
    }
    return jumped;
  }

  // The collision rectangle. It is shorter (and a bit wider) while ducking.
  getHitbox() {
    const duck = this.isDucking;
    const w = duck ? CONFIG.PANDA_DUCK_WIDTH : CONFIG.PANDA_WIDTH;
    const h = duck ? CONFIG.PANDA_DUCK_HEIGHT : CONFIG.PANDA_HEIGHT;
    return insetBox(this.x - w / 2, this.y - h, w, h);
  }

  // Draw the chosen character. mode is "run", "idle", "dizzy" or "happy";
  // "run" picks the jump / duck / running pose from the physics state.
  draw(ctx, mode, time, character = CHARACTERS[0]) {
    const poses = character.poses;
    const frame = Math.floor(this.animTime * CONFIG.RUN_ANIM_FPS) % 4;
    // Shadow on the ground (smaller when he is high up)
    const height = CONFIG.GROUND_Y - this.y;
    const s = Math.max(0.35, 1 - height / 220);
    ellipse(ctx, this.x, CONFIG.GROUND_Y + 2, 26 * s, 5 * s, 0, "rgba(0,0,0,0.22)");

    ctx.save();
    ctx.translate(this.x, this.y);
    if (mode === "idle") poses.idle(ctx, time);
    else if (mode === "dizzy") poses.dizzy(ctx, time);
    else if (mode === "happy") poses.happy(ctx, time);
    else if (!this.onGround) poses.jump(ctx, time);
    else if (this.isDucking) poses.duck(ctx, frame, time);
    else poses.run(ctx, frame, time);
    ctx.restore();
  }
}

/* ---- Panda drawing functions ----
   All of these draw with the origin (0,0) between the feet; "up" is
   negative y. The panda faces right. */

// Head with ears, eye patches, eyes, nose and mouth.
// eyes: "open" | "blink" | "happy" | "x"   mouth: "smile" | "open" | "wobble"
function drawPandaHead(ctx, cx, cy, r, eyes = "open", mouth = "smile") {
  // Ears
  ellipse(ctx, cx - r * 0.62, cy - r * 0.74, r * 0.36, r * 0.36, 0, PANDA_BLACK);
  ellipse(ctx, cx + r * 0.62, cy - r * 0.8, r * 0.36, r * 0.36, 0, PANDA_BLACK);
  // Head
  ellipse(ctx, cx, cy, r * 1.05, r, 0, PANDA_WHITE, PANDA_BLACK, 2);
  // Rosy cheeks
  ellipse(ctx, cx - r * 0.42, cy + r * 0.4, r * 0.17, r * 0.1, 0, "rgba(255,140,160,0.55)");
  ellipse(ctx, cx + r * 0.85, cy + r * 0.4, r * 0.14, r * 0.1, 0, "rgba(255,140,160,0.55)");
  // Black eye patches (slightly tilted, like a real panda)
  const lx = cx - r * 0.05, rx = cx + r * 0.55, ey = cy - r * 0.05;
  ellipse(ctx, lx, ey, r * 0.25, r * 0.33, 0.45, PANDA_BLACK);
  ellipse(ctx, rx, ey, r * 0.25, r * 0.33, -0.45, PANDA_BLACK);
  // Eyes
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 1.8;
  ctx.lineCap = "round";
  for (const ex of [lx + 1, rx - 1]) {
    const eyY = ey - r * 0.04;
    if (eyes === "open") {
      ellipse(ctx, ex, eyY, r * 0.12, r * 0.12, 0, "#fff");
      ellipse(ctx, ex + r * 0.03, eyY, r * 0.075, r * 0.075, 0, "#111");
      ellipse(ctx, ex + r * 0.06, eyY - r * 0.04, r * 0.03, r * 0.03, 0, "#fff");
    } else if (eyes === "blink") {
      ctx.beginPath();
      ctx.moveTo(ex - r * 0.1, eyY); ctx.lineTo(ex + r * 0.1, eyY);
      ctx.stroke();
    } else if (eyes === "happy") {
      ctx.beginPath();
      ctx.arc(ex, eyY + r * 0.05, r * 0.1, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
    } else if (eyes === "x") {
      const d = r * 0.09;
      ctx.beginPath();
      ctx.moveTo(ex - d, eyY - d); ctx.lineTo(ex + d, eyY + d);
      ctx.moveTo(ex + d, eyY - d); ctx.lineTo(ex - d, eyY + d);
      ctx.stroke();
    }
  }
  // Nose
  const nx = cx + r * 0.27, ny = cy + r * 0.3;
  ellipse(ctx, nx, ny, r * 0.13, r * 0.09, 0, PANDA_BLACK);
  // Mouth
  ctx.strokeStyle = PANDA_BLACK;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  if (mouth === "open") {
    ctx.moveTo(nx, ny + r * 0.08);
    ellipse(ctx, nx, ny + r * 0.25, r * 0.13, r * 0.12, 0, "#e8576e", PANDA_BLACK, 1.5);
  } else if (mouth === "wobble") {
    ctx.moveTo(nx - r * 0.2, ny + r * 0.25);
    ctx.quadraticCurveTo(nx - r * 0.1, ny + r * 0.15, nx, ny + r * 0.25);
    ctx.quadraticCurveTo(nx + r * 0.1, ny + r * 0.35, nx + r * 0.2, ny + r * 0.25);
    ctx.stroke();
  } else {
    ctx.moveTo(nx, ny + r * 0.08);
    ctx.lineTo(nx, ny + r * 0.16);
    ctx.arc(nx - r * 0.09, ny + r * 0.16, r * 0.09, 0, Math.PI);
    ctx.moveTo(nx, ny + r * 0.16);
    ctx.arc(nx + r * 0.09, ny + r * 0.16, r * 0.09, Math.PI, 0, true);
    ctx.stroke();
  }
}

// A chunky black leg. lift raises the foot off the ground.
function drawLeg(ctx, x, lift) {
  roundRectPath(ctx, x - 7, -19 - lift, 14, 19, 6);
  ctx.fillStyle = PANDA_BLACK;
  ctx.fill();
}

// The round white body plus its little tail.
function drawBody(ctx, cx, cy, rx, ry) {
  ellipse(ctx, cx - rx * 0.98, cy - ry * 0.2, 5, 5, 0, PANDA_WHITE, PANDA_BLACK, 1.5); // tail
  ellipse(ctx, cx, cy, rx, ry, 0, PANDA_WHITE, PANDA_BLACK, 2);
  // Black shoulder band, typical of pandas
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  ctx.clip();
  ellipse(ctx, cx + rx * 0.45, cy - ry * 0.55, rx * 0.5, ry * 0.32, -0.5, PANDA_BLACK);
  ctx.restore();
}

// Running: 4 frames of leg / arm swing.
function drawPandaRun(ctx, frame) {
  //            backX backLift frontX frontLift
  const legs = [[-9, 0, 9, 0], [-3, 5, 3, 0], [9, 0, -9, 0], [3, 0, -3, 5]][frame];
  const armSwing = [0.6, 0, -0.6, 0][frame];
  const bob = frame % 2 === 1 ? -2 : 0;
  // Back arm and legs first so the body overlaps them
  ellipse(ctx, -9, -33 + bob, 6, 12, -armSwing, "#121215");
  drawLeg(ctx, -2 + legs[0], legs[1]);
  drawLeg(ctx, -2 + legs[2], legs[3]);
  drawBody(ctx, -2, -31 + bob, 23, 21);
  ellipse(ctx, 9, -31 + bob, 6.5, 12, armSwing, PANDA_BLACK); // front arm
  drawPandaHead(ctx, 9, -52 + bob, 17, "open", "smile");
}

// Standing still on the title screen: breathing and blinking.
function drawPandaIdle(ctx, time) {
  const bob = Math.sin(time * 2.5) * 1.2;
  const blink = time % 3.2 < 0.13;
  ellipse(ctx, -9, -33 + bob, 6, 12, 0.15, "#121215");
  drawLeg(ctx, -10, 0);
  drawLeg(ctx, 6, 0);
  drawBody(ctx, -2, -31 + bob, 23, 21);
  // Front arm waves
  ellipse(ctx, 13, -40 + bob, 6.5, 12, -1.9 + Math.sin(time * 6) * 0.35, PANDA_BLACK);
  drawPandaHead(ctx, 9, -52 + bob, 17, blink ? "blink" : "open", "smile");
}

// Jumping: legs tucked up, arms out.
function drawPandaJump(ctx) {
  ellipse(ctx, -16, -44, 6, 12, -0.9, "#121215");     // back arm up
  ellipse(ctx, -12, -13, 9, 7, 0.3, PANDA_BLACK);      // tucked legs
  ellipse(ctx, 6, -11, 9, 7, -0.2, PANDA_BLACK);
  drawBody(ctx, -2, -32, 23, 21);
  ellipse(ctx, 16, -40, 6.5, 12, 1.0, PANDA_BLACK);    // front arm forward
  drawPandaHead(ctx, 9, -53, 17, "open", "open");
}

// Ducking: squashed low body, head tucked down, little legs scurrying.
function drawPandaDuck(ctx, frame) {
  const s = frame % 2 === 0 ? 3 : -3;
  ellipse(ctx, -16 + s, -5, 7, 5, 0, PANDA_BLACK);
  ellipse(ctx, 8 - s, -5, 7, 5, 0, PANDA_BLACK);
  drawBody(ctx, -5, -16, 27, 14);
  ellipse(ctx, 16, -7, 6, 5, 0, PANDA_BLACK);          // front paw
  drawPandaHead(ctx, 17, -21, 14, "open", "smile");
}

// Game over: sitting on the ground, tilted back, X eyes, stars spinning.
function drawPandaDizzy(ctx, time) {
  ctx.save();
  ctx.rotate(-0.18);
  ellipse(ctx, 16, -7, 10, 6.5, -0.3, PANDA_BLACK);    // legs stuck out
  ellipse(ctx, 2, -5, 10, 6.5, 0.2, PANDA_BLACK);
  ellipse(ctx, -20, -20, 6, 11, 0.9, "#121215");       // floppy arm
  drawBody(ctx, -4, -25, 23, 20);
  ellipse(ctx, 13, -22, 6, 11, -0.7, PANDA_BLACK);
  drawPandaHead(ctx, 4, -47, 17, "x", "wobble");
  // Orbiting stars
  for (let i = 0; i < 3; i++) {
    const a = time * 4 + (i * Math.PI * 2) / 3;
    drawStar(ctx, 4 + Math.cos(a) * 24, -70 + Math.sin(a) * 6, 5, "#ffd23f");
  }
  ctx.restore();
}

// Winning: arms up, happy closed eyes, open mouth.
function drawPandaHappy(ctx, time) {
  const wave = Math.sin(time * 10) * 0.2;
  drawLeg(ctx, -10, 2);
  drawLeg(ctx, 6, 2);
  ellipse(ctx, -20, -50, 6, 12, -0.5 + wave, "#121215");
  drawBody(ctx, -2, -31, 23, 21);
  ellipse(ctx, 22, -52, 6.5, 12, 0.5 - wave, PANDA_BLACK);
  drawPandaHead(ctx, 9, -52, 17, "happy", "open");
}


/* ---- Dog drawing functions ----
   Same rules as the panda: origin (0,0) between the feet, facing right,
   and the standing / ducking drawings fit the shared player hitbox.
   The wagging tail is decoration (it sticks out behind the hitbox). */
const DOG_FUR = "#d9a05b";
const DOG_DARK = "#b47a3c";
const DOG_LIGHT = "#f6dfb8";
const DOG_EAR = "#8a5a2b";
const DOG_LINE = "#5a3a1a";

// Head with snout, floppy ear and tongue.
// eyes: "open" | "blink" | "happy" | "x"   ear: "down" | "up" | "flat"
function drawDogHead(ctx, cx, cy, r, eyes = "open", ear = "down", tongue = true, t = 0) {
  // Far ear peeks out behind the head
  ellipse(ctx, cx + r * 0.35, cy - r * 0.75, r * 0.22, r * 0.32, 0.4, DOG_EAR);
  ellipse(ctx, cx, cy, r, r * 0.95, 0, DOG_FUR, DOG_LINE, 2);
  // Snout and nose
  ellipse(ctx, cx + r * 0.72, cy + r * 0.28, r * 0.55, r * 0.4, 0, DOG_LIGHT, DOG_LINE, 1.5);
  ellipse(ctx, cx + r * 1.18, cy + r * 0.12, r * 0.17, r * 0.13, 0, "#222");
  ellipse(ctx, cx + r * 1.14, cy + r * 0.07, r * 0.06, r * 0.04, 0, "rgba(255,255,255,0.7)");
  // Mouth and tongue
  ctx.strokeStyle = DOG_LINE;
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.moveTo(cx + r * 1.12, cy + r * 0.28);
  ctx.quadraticCurveTo(cx + r * 0.95, cy + r * 0.55, cx + r * 0.62, cy + r * 0.45);
  ctx.stroke();
  if (tongue) {
    const wag = Math.sin(t * 14) * 0.08;
    ellipse(ctx, cx + r * 0.8, cy + r * 0.66, r * 0.15, r * 0.27, wag, "#ff7b93", "#c94b62", 1);
    ctx.beginPath();
    ctx.moveTo(cx + r * 0.8, cy + r * 0.5);
    ctx.lineTo(cx + r * 0.8, cy + r * 0.78);
    ctx.stroke();
  }
  ellipse(ctx, cx + r * 0.25, cy + r * 0.38, r * 0.15, r * 0.09, 0, "rgba(255,120,120,0.45)"); // blush
  // Eyes
  ctx.strokeStyle = "#2a1a0a";
  ctx.lineWidth = 1.8;
  ctx.lineCap = "round";
  for (const ex of [cx + r * 0.05, cx + r * 0.52]) {
    const ey = cy - r * 0.18;
    if (eyes === "open") {
      ellipse(ctx, ex, ey, r * 0.12, r * 0.14, 0, "#2a1a0a");
      ellipse(ctx, ex + r * 0.04, ey - r * 0.05, r * 0.04, r * 0.04, 0, "#fff");
    } else if (eyes === "blink") {
      ctx.beginPath(); ctx.moveTo(ex - r * 0.1, ey); ctx.lineTo(ex + r * 0.1, ey); ctx.stroke();
    } else if (eyes === "happy") {
      ctx.beginPath(); ctx.arc(ex, ey + r * 0.05, r * 0.1, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    } else if (eyes === "x") {
      const d = r * 0.09;
      ctx.beginPath();
      ctx.moveTo(ex - d, ey - d); ctx.lineTo(ex + d, ey + d);
      ctx.moveTo(ex + d, ey - d); ctx.lineTo(ex - d, ey + d);
      ctx.stroke();
    }
  }
  // Floppy front ear (drawn last so it hangs over the head)
  const flop = Math.sin(t * 12) * 0.12;
  if (ear === "up") ellipse(ctx, cx - r * 0.55, cy - r * 0.85, r * 0.27, r * 0.6, -1.0 + flop, DOG_EAR, DOG_LINE, 1.5);
  else if (ear === "flat") ellipse(ctx, cx - r * 0.75, cy + r * 0.1, r * 0.27, r * 0.6, 1.25, DOG_EAR, DOG_LINE, 1.5);
  else ellipse(ctx, cx - r * 0.5, cy + r * 0.05, r * 0.3, r * 0.62, 0.35 + flop, DOG_EAR, DOG_LINE, 1.5);
}

// Wagging tail; angle tilts it (bigger = further back).
function drawDogTail(ctx, x, y, angle) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-9, -3, -10, -15);
  ctx.strokeStyle = DOG_LINE;
  ctx.lineWidth = 7.5;
  ctx.stroke();
  ctx.strokeStyle = DOG_DARK;
  ctx.lineWidth = 4.5;
  ctx.stroke();
  ctx.restore();
}

function drawDogBody(ctx, cx, cy, rx, ry) {
  ellipse(ctx, cx, cy, rx, ry, 0, DOG_FUR, DOG_LINE, 2);
  ellipse(ctx, cx + rx * 0.3, cy + ry * 0.25, rx * 0.45, ry * 0.55, 0, DOG_LIGHT); // tummy
  // Red collar with a gold tag
  ctx.beginPath();
  ctx.moveTo(cx + rx * 0.15, cy - ry * 0.9);
  ctx.quadraticCurveTo(cx + rx * 0.6, cy - ry * 0.55, cx + rx * 0.85, cy - ry * 0.3);
  ctx.strokeStyle = "#d63b3b";
  ctx.lineWidth = 4;
  ctx.lineCap = "round";
  ctx.stroke();
  ellipse(ctx, cx + rx * 0.62, cy - ry * 0.4, 2.8, 2.8, 0, "#f6c945", "#b8860b", 1);
}

function drawDogLeg(ctx, x, lift) {
  roundRectPath(ctx, x - 6.5, -19 - lift, 13, 19, 6);
  ctx.fillStyle = DOG_DARK;
  ctx.fill();
  ctx.strokeStyle = DOG_LINE;
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ellipse(ctx, x + 1, -2.5 - lift, 6, 2.6, 0, DOG_LIGHT);
}

function drawDogRun(ctx, frame, t) {
  const legs = [[-9, 0, 9, 0], [-3, 5, 3, 0], [9, 0, -9, 0], [3, 0, -3, 5]][frame];
  const armSwing = [0.6, 0, -0.6, 0][frame];
  const bob = frame % 2 === 1 ? -2 : 0;
  drawDogTail(ctx, -22, -36 + bob, Math.sin(t * 22) * 0.45); // wagging
  ellipse(ctx, -9, -33 + bob, 6, 12, -armSwing, DOG_DARK);
  drawDogLeg(ctx, -2 + legs[0], legs[1]);
  drawDogLeg(ctx, -2 + legs[2], legs[3]);
  drawDogBody(ctx, -2, -31 + bob, 23, 21);
  ellipse(ctx, 9, -31 + bob, 6.5, 12, armSwing, DOG_FUR, DOG_LINE, 1.5);
  drawDogHead(ctx, 6, -52 + bob, 16, "open", "down", true, t);
}

function drawDogIdle(ctx, t) {
  const bob = Math.sin(t * 2.5) * 1.2;
  const blink = t % 3.2 < 0.13;
  drawDogTail(ctx, -22, -36 + bob, Math.sin(t * 10) * 0.4);
  ellipse(ctx, -9, -33 + bob, 6, 12, 0.15, DOG_DARK);
  drawDogLeg(ctx, -10, 0);
  drawDogLeg(ctx, 6, 0);
  drawDogBody(ctx, -2, -31 + bob, 23, 21);
  ellipse(ctx, 12, -38 + bob, 6.5, 12, -1.8 + Math.sin(t * 6) * 0.35, DOG_FUR, DOG_LINE, 1.5); // wave
  drawDogHead(ctx, 6, -52 + bob, 16, blink ? "blink" : "open", "down", true, t);
}

function drawDogJump(ctx, t) {
  drawDogTail(ctx, -22, -38, -0.5);
  ellipse(ctx, -16, -44, 6, 12, -0.9, DOG_DARK);
  ellipse(ctx, -12, -13, 9, 7, 0.3, DOG_DARK, DOG_LINE, 1.2);
  ellipse(ctx, 6, -11, 9, 7, -0.2, DOG_DARK, DOG_LINE, 1.2);
  drawDogBody(ctx, -2, -32, 23, 21);
  ellipse(ctx, 16, -40, 6.5, 12, 1.0, DOG_FUR, DOG_LINE, 1.5);
  drawDogHead(ctx, 6, -53, 16, "open", "up", true, t);
}

// Low crouch with the ears flopped down.
function drawDogDuck(ctx, frame, t) {
  const s = frame % 2 === 0 ? 3 : -3;
  drawDogTail(ctx, -28, -14, 0.9 + Math.sin(t * 22) * 0.25);
  ellipse(ctx, -17 + s, -5, 7, 5, 0, DOG_DARK);
  ellipse(ctx, 7 - s, -5, 7, 5, 0, DOG_DARK);
  drawDogBody(ctx, -6, -16, 26, 13);
  ellipse(ctx, 13, -6, 6, 4.5, 0, DOG_FUR, DOG_LINE, 1.2);
  drawDogHead(ctx, 15, -20, 13, "open", "flat", true, t);
}

function drawDogDizzy(ctx, t) {
  ctx.save();
  ctx.rotate(-0.18);
  drawDogTail(ctx, -24, -12, 1.4);
  ellipse(ctx, 16, -7, 10, 6.5, -0.3, DOG_DARK, DOG_LINE, 1.2);
  ellipse(ctx, 2, -5, 10, 6.5, 0.2, DOG_DARK, DOG_LINE, 1.2);
  ellipse(ctx, -20, -20, 6, 11, 0.9, DOG_DARK);
  drawDogBody(ctx, -4, -25, 23, 20);
  ellipse(ctx, 13, -22, 6, 11, -0.7, DOG_FUR, DOG_LINE, 1.5);
  drawDogHead(ctx, 3, -47, 16, "x", "flat", true, t);
  for (let i = 0; i < 3; i++) {
    const a = t * 4 + (i * Math.PI * 2) / 3;
    drawStar(ctx, 3 + Math.cos(a) * 24, -70 + Math.sin(a) * 6, 5, "#ffd23f");
  }
  ctx.restore();
}

function drawDogHappy(ctx, t) {
  const wave = Math.sin(t * 10) * 0.2;
  drawDogTail(ctx, -22, -36, Math.sin(t * 30) * 0.5);
  drawDogLeg(ctx, -10, 2);
  drawDogLeg(ctx, 6, 2);
  ellipse(ctx, -20, -50, 6, 12, -0.5 + wave, DOG_DARK);
  drawDogBody(ctx, -2, -31, 23, 21);
  ellipse(ctx, 22, -52, 6.5, 12, 0.5 - wave, DOG_FUR, DOG_LINE, 1.5);
  drawDogHead(ctx, 6, -52, 16, "happy", "up", true, t);
}


/* ---- Unicorn drawing functions ----
   A chibi unicorn on four galloping legs. The horn and the rainbow tail
   are decoration; the body, legs and head fit the shared player hitbox. */
const UNI_BODY = "#fdf2f8";
const UNI_SHADE = "#ecd9e8";
const UNI_LINE = "#9a7aa0";
const UNI_HOOF = "#c9a96e";
const RAINBOW = ["#ff9aa2", "#ffb86b", "#fff07a", "#9be7a0", "#8ecbff", "#c3a6ff"];

// One leg hanging from a hip/shoulder at (px, py), rotated by `angle`
// (positive swings the hoof backward). len scales the leg (ducking).
function drawUnicornLeg(ctx, px, py, angle, color, len = 1) {
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(angle);
  ctx.scale(1, len);
  roundRectPath(ctx, -3.4, 0, 6.8, 17, 3);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = UNI_LINE;
  ctx.lineWidth = 1.2;
  ctx.stroke();
  roundRectPath(ctx, -3.6, 15, 7.2, 4.5, 1.5);
  ctx.fillStyle = UNI_HOOF;
  ctx.fill();
  ctx.restore();
}

// Rainbow tail flowing behind (decoration).
function drawUnicornTail(ctx, x, y, t, lift = 0) {
  ctx.lineCap = "round";
  RAINBOW.forEach((c, i) => {
    const sway = Math.sin(t * 8 + i * 0.5) * 3;
    ctx.beginPath();
    ctx.moveTo(x, y + i * 1.4);
    ctx.quadraticCurveTo(x - 10, y - 6 - lift + i * 2, x - 13 + sway, y + 12 - lift * 1.5 + i * 2.4);
    ctx.strokeStyle = c;
    ctx.lineWidth = 3.2;
    ctx.stroke();
  });
}

// Rainbow mane: a row of puffs from (x0, y0) down to (x1, y1).
function drawUnicornMane(ctx, x0, y0, x1, y1, t) {
  const n = 6;
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const wob = Math.sin(t * 6 + i) * 0.8;
    ellipse(ctx, x0 + (x1 - x0) * f + wob, y0 + (y1 - y0) * f, 5, 4.5, 0, RAINBOW[i % RAINBOW.length]);
  }
}

// Head drawn around (0,0) facing right; the caller translates / rotates it.
function drawUnicornHead(ctx, eyes = "open", t = 0) {
  // Golden spiral horn (decoration, not part of the hitbox)
  ctx.beginPath();
  ctx.moveTo(-1.5, -8);
  ctx.lineTo(4.5, -8.5);
  ctx.lineTo(4, -23);
  ctx.closePath();
  ctx.fillStyle = "#f6c945";
  ctx.fill();
  ctx.strokeStyle = "#c9962a";
  ctx.lineWidth = 1;
  ctx.stroke();
  for (let k = 0; k < 3; k++) {
    ctx.beginPath();
    ctx.moveTo(-0.5 + k * 1.2, -10.5 - k * 4);
    ctx.lineTo(4.2 - k * 0.2, -12 - k * 4);
    ctx.stroke();
  }
  // Ear
  ctx.beginPath();
  ctx.moveTo(-6, -6); ctx.lineTo(-4.5, -14); ctx.lineTo(-1, -7);
  ctx.closePath();
  ctx.fillStyle = UNI_BODY;
  ctx.fill();
  ctx.strokeStyle = UNI_LINE;
  ctx.stroke();
  // Head and snout
  ellipse(ctx, 0, 0, 10, 9, 0, UNI_BODY, UNI_LINE, 1.6);
  ellipse(ctx, 7, 3.5, 7, 6, 0, "#fde4ef", UNI_LINE, 1.4);
  ellipse(ctx, 11, 2.5, 1, 1.4, 0, UNI_LINE);
  ellipse(ctx, 3, 4.5, 2.4, 1.4, 0, "rgba(255,120,160,0.45)"); // blush
  ctx.beginPath();
  ctx.moveTo(8, 7);
  ctx.quadraticCurveTo(10, 8.5, 12, 7);
  ctx.strokeStyle = UNI_LINE;
  ctx.lineWidth = 1;
  ctx.stroke();
  // Eye with lashes
  ctx.strokeStyle = "#4a2a50";
  ctx.lineWidth = 1.5;
  ctx.lineCap = "round";
  const ex = 1, ey = -1.5;
  if (eyes === "open") {
    ellipse(ctx, ex, ey, 2.3, 2.8, 0, "#4a2a50");
    ellipse(ctx, ex + 0.8, ey - 1, 0.8, 0.8, 0, "#fff");
    ctx.beginPath();
    ctx.moveTo(ex - 2, ey - 2); ctx.lineTo(ex - 3.5, ey - 4);
    ctx.moveTo(ex, ey - 2.8); ctx.lineTo(ex - 0.5, ey - 5);
    ctx.stroke();
  } else if (eyes === "blink" || eyes === "happy") {
    ctx.beginPath();
    if (eyes === "happy") ctx.arc(ex, ey + 0.5, 2.3, Math.PI * 1.1, Math.PI * 1.9);
    else { ctx.moveTo(ex - 2.3, ey); ctx.lineTo(ex + 2.3, ey); }
    ctx.stroke();
  } else if (eyes === "x") {
    ctx.beginPath();
    ctx.moveTo(ex - 2, ey - 2); ctx.lineTo(ex + 2, ey + 2);
    ctx.moveTo(ex + 2, ey - 2); ctx.lineTo(ex - 2, ey + 2);
    ctx.stroke();
  }
}

// Standing / running body. legAngles = [backFar, frontFar, backNear, frontNear].
function drawUnicornStanding(ctx, legAngles, bob, eyes, t, headTilt = 0) {
  drawUnicornTail(ctx, -25, -38 + bob, t);
  drawUnicornLeg(ctx, -15, -21 + bob, legAngles[0], UNI_SHADE);
  drawUnicornLeg(ctx, 6, -21 + bob, legAngles[1], UNI_SHADE);
  ellipse(ctx, -6, -33 + bob, 21, 13, 0, UNI_BODY, UNI_LINE, 1.8);
  drawUnicornLeg(ctx, -19, -21 + bob, legAngles[2], UNI_BODY);
  drawUnicornLeg(ctx, 2, -21 + bob, legAngles[3], UNI_BODY);
  ellipse(ctx, 10, -45 + bob, 7, 12, 0.45, UNI_BODY, UNI_LINE, 1.6);    // neck
  ellipse(ctx, 10, -42 + bob, 5.2, 10, 0.45, UNI_BODY);                // hide the neck seam
  drawUnicornMane(ctx, 8, -63 + bob, -1, -44 + bob, t);
  ctx.save();
  ctx.translate(15, -56 + bob);
  ctx.rotate(headTilt);
  drawUnicornHead(ctx, eyes, t);
  ctx.restore();
}

function drawUnicornRun(ctx, frame, t) {
  const p = (frame * Math.PI) / 2;
  const a = (o) => Math.sin(p + o) * 0.5;
  drawUnicornStanding(ctx, [a(0.6), a(Math.PI + 0.6), a(0), a(Math.PI)], frame % 2 ? -2 : 0, "open", t);
}

function drawUnicornIdle(ctx, t) {
  const bob = Math.sin(t * 2.5) * 1.2;
  drawUnicornStanding(ctx, [0.05, -0.05, -0.05, 0.05], bob, t % 3.2 < 0.13 ? "blink" : "open", t, Math.sin(t * 1.5) * 0.06);
}

function drawUnicornJump(ctx, t) {
  drawUnicornStanding(ctx, [1.1, -1.25, 0.9, -1.05], -2, "open", t, -0.1);
}

// Ducking: low body, bent legs, head and horn lowered forward.
function drawUnicornDuck(ctx, frame, t) {
  const sw = frame % 2 ? 0.25 : -0.25;
  drawUnicornTail(ctx, -27, -24, t, -4);
  drawUnicornLeg(ctx, -15, -12, sw, UNI_SHADE, 0.62);
  drawUnicornLeg(ctx, 6, -12, -sw, UNI_SHADE, 0.62);
  ellipse(ctx, -7, -20, 22, 10.5, 0, UNI_BODY, UNI_LINE, 1.8);
  drawUnicornLeg(ctx, -19, -12, -sw, UNI_BODY, 0.62);
  drawUnicornLeg(ctx, 2, -12, sw, UNI_BODY, 0.62);
  drawUnicornMane(ctx, 7, -30, -6, -26, t);
  ctx.save();
  ctx.translate(19, -19);
  ctx.rotate(0.75); // head down, horn pointing forward
  drawUnicornHead(ctx, "open", t);
  ctx.restore();
}

function drawUnicornDizzy(ctx, t) {
  ctx.save();
  ctx.rotate(-0.12);
  drawUnicornTail(ctx, -24, -16, t, -6);
  drawUnicornLeg(ctx, -14, -12, -1.3, UNI_SHADE);
  drawUnicornLeg(ctx, 4, -12, -1.4, UNI_SHADE);
  ellipse(ctx, -6, -19, 21, 12, 0, UNI_BODY, UNI_LINE, 1.8);
  drawUnicornLeg(ctx, -18, -12, -1.5, UNI_BODY);
  drawUnicornLeg(ctx, 0, -12, -1.6, UNI_BODY);
  drawUnicornMane(ctx, 6, -44, -2, -28, t);
  ctx.save();
  ctx.translate(12, -40);
  ctx.rotate(-0.35);
  drawUnicornHead(ctx, "x", t);
  ctx.restore();
  for (let i = 0; i < 3; i++) {
    const a = t * 4 + (i * Math.PI * 2) / 3;
    drawStar(ctx, 10 + Math.cos(a) * 22, -66 + Math.sin(a) * 6, 5, "#ffd23f");
  }
  ctx.restore();
}

// Happy: rearing up on the back legs.
function drawUnicornHappy(ctx, t) {
  ctx.save();
  ctx.rotate(-0.28);
  const kick = Math.sin(t * 10) * 0.3;
  drawUnicornStanding(ctx, [0.1, -1.1 + kick, -0.1, -1.3 - kick], 0, "happy", t, 0.1);
  ctx.restore();
}


/* ---- Collectibles ----
   All of them are drawn inside the same 16 x 40 box as the bamboo stick,
   so they share the same hitbox. (cx, top) = top centre, h = height. */

// Classic cartoon dog bone, tilted.
function drawBone(ctx, cx, top, h) {
  ctx.save();
  ctx.translate(cx, top + h / 2);
  ctx.rotate(0.35);
  const half = h * 0.36, k = h * 0.12;
  for (const sy of [-half, half]) {
    for (const sx of [-k * 0.75, k * 0.75]) ellipse(ctx, sx, sy, k, k, 0, "#fffaf0", "#b8a888", 1.5);
  }
  ctx.fillStyle = "#fffaf0";
  ctx.fillRect(-k * 0.75, -half, k * 1.5, half * 2);
  ctx.strokeStyle = "#b8a888";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-k * 0.75, -half + k * 0.6); ctx.lineTo(-k * 0.75, half - k * 0.6);
  ctx.moveTo(k * 0.75, -half + k * 0.6); ctx.lineTo(k * 0.75, half - k * 0.6);
  ctx.stroke();
  ctx.restore();
}

const CRYSTAL_COLORS = [
  ["#ffb3da", "#ff5fa8", "#c2307a"], // pink
  ["#d6c2ff", "#9a6cf2", "#6a3cc0"], // purple
  ["#bfeaff", "#55bdf2", "#2a86c0"], // light blue
];

// Pointed magic gem with a soft glow and a twinkle. variant picks the color.
function drawCrystal(ctx, cx, top, h, t = 0, variant = 0) {
  const [light, mid, dark] = CRYSTAL_COLORS[variant % CRYSTAL_COLORS.length];
  const w = h * 0.2;
  const g = ctx.createRadialGradient(cx, top + h / 2, 2, cx, top + h / 2, h * 0.6);
  g.addColorStop(0, "rgba(255,255,255,0.35)");
  g.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = g;
  ctx.fillRect(cx - h * 0.6, top - h * 0.1, h * 1.2, h * 1.2);
  const pts = [[0, 0], [w, h * 0.3], [w * 0.85, h * 0.72], [0, h], [-w * 0.85, h * 0.72], [-w, h * 0.3]];
  ctx.beginPath();
  for (const [px, py] of pts) ctx.lineTo(cx + px, top + py);
  ctx.closePath();
  ctx.fillStyle = mid;
  ctx.fill();
  ctx.strokeStyle = dark;
  ctx.lineWidth = 1.3;
  ctx.stroke();
  // Facets: lighter left face, centre ridge
  ctx.beginPath();
  ctx.moveTo(cx, top); ctx.lineTo(cx - w, top + h * 0.3); ctx.lineTo(cx - w * 0.85, top + h * 0.72); ctx.lineTo(cx, top + h);
  ctx.closePath();
  ctx.fillStyle = light;
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx, top); ctx.lineTo(cx, top + h);
  ctx.moveTo(cx - w, top + h * 0.3); ctx.lineTo(cx + w, top + h * 0.3);
  ctx.strokeStyle = "rgba(255,255,255,0.7)";
  ctx.lineWidth = 1;
  ctx.stroke();
  const tw = 1.5 + 2.5 * Math.abs(Math.sin(t * 3 + variant * 1.7));
  drawStar(ctx, cx + w * 0.55, top + h * 0.22, tw, "#ffffff");
}


/* =====================================================================
   Characters registry
   Each entry describes one playable character. To add a character, add
   one entry with:
     id, name, the     - id, display name, and how messages refer to it
     collectible       - { one, many }: names of the thing it collects
     poses             - draw functions, all with the origin between the
                         feet: run(ctx, frame 0-3, t), idle(ctx, t),
                         jump(ctx, t), duck(ctx, frame, t), dizzy(ctx, t),
                         happy(ctx, t). Keep standing poses inside
                         PANDA_WIDTH x PANDA_HEIGHT and the duck pose inside
                         PANDA_DUCK_WIDTH x PANDA_DUCK_HEIGHT: every
                         character shares the same hitbox.
     drawCollectible   - (ctx, cx, top, h, t, variant): draws one collectible
                         inside the bamboo-sized box
     collectSound      - "ding" | "bark" | "chime" (see Sound.collect)
     ouch              - settings for its "ouch" sound (see Sound.ouch)
     sparkColors       - colors of the collect burst
     sparkleTrail      - true = leave a little sparkle trail while running
     accent            - text color used for its name and counter
   ===================================================================== */
const CHARACTERS = [
  {
    id: "panda", name: "Panda", the: "the panda",
    collectible: { one: "bamboo", many: "bamboo" },
    poses: {

      jump: (ctx) => drawPandaJump(ctx),
      duck: (ctx, f) => drawPandaDuck(ctx, f),
      dizzy: (ctx, t) => drawPandaDizzy(ctx, t),
      happy: (ctx, t) => drawPandaHappy(ctx, t),
    },
    drawCollectible: (ctx, cx, top, h) => drawBambooStalk(ctx, cx, top, h),
    collectSound: "ding",
    ouch: { type: "sawtooth", from: 820, to: 300, dur: 0.42, wobbleHz: 16, wobbleDepth: 45, filter: 1800 },
    sparkColors: ["#ffe066", "#b6f07a", "#ffffff"],
    accent: "#2f5d1a",
  },
  {
    id: "dog", name: "Dog", the: "the dog",
    collectible: { one: "bone", many: "bones" },
    poses: {
      run: drawDogRun, idle: drawDogIdle, jump: drawDogJump,
      duck: drawDogDuck, dizzy: drawDogDizzy, happy: drawDogHappy,
    },
    drawCollectible: (ctx, cx, top, h) => drawBone(ctx, cx, top, h),
    collectSound: "bark",
    // A quick, high yelp
    ouch: { type: "sawtooth", from: 1400, to: 620, dur: 0.26, wobbleHz: 28, wobbleDepth: 60, filter: 2600 },
    sparkColors: ["#fff4d6", "#ffd27a", "#ffffff"],
    accent: "#8a4f16",
  },
  {
    id: "unicorn", name: "Unicorn", the: "the unicorn",
    collectible: { one: "magic crystal", many: "magic crystals" },
    poses: {
      run: drawUnicornRun, idle: drawUnicornIdle, jump: drawUnicornJump,
      duck: drawUnicornDuck, dizzy: drawUnicornDizzy, happy: drawUnicornHappy,
    },
    drawCollectible: (ctx, cx, top, h, t, variant) => drawCrystal(ctx, cx, top, h, t, variant),
    collectSound: "chime",
    // A soft whinny: up, then down, with a wide fast wobble
    ouch: { type: "triangle", from: 700, mid: 1250, to: 440, dur: 0.6, wobbleHz: 9, wobbleDepth: 90, filter: 3200 },
    sparkColors: ["#ffb3da", "#d6c2ff", "#bfeaff", "#fff6b0"],
    sparkleTrail: true,
    accent: "#8a3cc0",

/* =====================================================================
   5. Obstacles
   Every obstacle style lives in the OBSTACLE_TYPES registry below.
   Each entry has:
     id, name     - a unique id and a readable name
     category     - "rock", "branch", "log", "bush", "cactus", "lava",
                    "beehive" or "bird"
     kind         - "ground" (jump over it) or "overhead" (duck under it)
     label        - the word used on the Game Over screen
     zones        - which themed zones it appears in (see ZONES)
     minBamboo    - it only appears once you have this many bamboo
     make(o)      - sets the size (o.w, o.h) and any random details
     boxes(o)     - the SOLID parts as rectangles {x, y, w, h}. x is
                    measured from the obstacle's left edge; y is a normal
                    screen y. These become the hitboxes (shrunk by
                    HITBOX_INSET). Decorations such as moss, flowers, bees,
                    glow or sparks are drawn but NOT listed here, so they
                    never hurt the panda.
     draw(ctx, o, t) - draws it (t = game time, for animations)
   Fairness rules (checked automatically at startup, see the console):
     ground boxes are at most GROUND_OBSTACLE_MAX_HEIGHT tall, and
     overhead boxes end at least BRANCH_CLEARANCE above the ground.
   To add a style, copy an entry and change it.
   ===================================================================== */

const ALL_ZONES = ["spring", "autumn", "snow", "desert", "volcano"];

/* ---------- Shared helpers: rocks ---------- */

// Pick a rock size and build a lumpy outline for it.
function makeRock(o, jagged = false) {
  const s = choose(CONFIG.ROCK_SIZES);
  o.w = s.w;
  o.h = s.h;
  o.rw = s.w; // width of the rock body itself
  o.points = rockOutline(o.rw, o.h, jagged);
}

// Points around a half-ellipse with random wobble (relative to bottom-left;
// up is negative y). jagged = sharper, spikier outline.
function rockOutline(w, h, jagged) {
  const pts = [];
  const n = jagged ? 10 : 8;
  for (let i = 0; i <= n; i++) {
    const a = Math.PI - (Math.PI * i) / n;
    let r = 1;
    if (i !== 0 && i !== n) r = jagged ? (i % 2 ? rand(0.68, 0.82) : rand(0.95, 1)) : rand(0.86, 1);
    pts.push({ x: w / 2 + Math.cos(a) * (w / 2) * r, y: -Math.sin(a) * h * r });
  }
  return pts;
}

// One box covering the whole obstacle, sitting on the ground.
const groundBox = (o) => [{ x: 0, y: CONFIG.GROUND_Y - o.h, w: o.w, h: o.h }];

function rockPath(ctx, o) {
  ctx.beginPath();
  for (const p of o.points) ctx.lineTo(o.x + p.x, CONFIG.GROUND_Y + p.y);
  ctx.closePath();
}

// Fill and outline the rock with a top-to-bottom gradient.
function paintRock(ctx, o, light, dark, outline) {
  const gy = CONFIG.GROUND_Y;
  rockPath(ctx, o);
  const g = ctx.createLinearGradient(0, gy - o.h, 0, gy);
  g.addColorStop(0, light);
  g.addColorStop(1, dark);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.lineJoin = "round";
  ctx.strokeStyle = outline;
  ctx.stroke();
}

function rockHighlight(ctx, o, alpha = 0.4) {
  ellipse(ctx, o.x + o.rw * 0.35, CONFIG.GROUND_Y - o.h * 0.68, o.rw * 0.14, o.h * 0.1, -0.4, `rgba(255,255,255,${alpha})`);
}

function rockCrack(ctx, o, color = "rgba(40,40,45,0.6)", width = 1.3) {
  const gy = CONFIG.GROUND_Y, x = o.x, w = o.rw, h = o.h;
  ctx.beginPath();
  ctx.moveTo(x + w * 0.62, gy - h * 0.8);
  ctx.lineTo(x + w * 0.55, gy - h * 0.5);
  ctx.lineTo(x + w * 0.64, gy - h * 0.28);
  ctx.moveTo(x + w * 0.55, gy - h * 0.5);
  ctx.lineTo(x + w * 0.43, gy - h * 0.4);
  ctx.lineWidth = width;
  ctx.strokeStyle = color;
  ctx.stroke();
}

// Run drawFn with drawing clipped to the rock's outline (for moss, snow, stripes).
function insideRock(ctx, o, drawFn) {
  ctx.save();
  rockPath(ctx, o);
  ctx.clip();
  drawFn();
  ctx.restore();
}

// A tiny five-petal flower on a stem.
function drawFlower(ctx, x, y, color) {
  const gy = CONFIG.GROUND_Y;
  ctx.beginPath();
  ctx.moveTo(x, gy);
  ctx.lineTo(x, y);
  ctx.strokeStyle = "#3f8a2c";
  ctx.lineWidth = 1.2;
  ctx.stroke();
  for (let i = 0; i < 5; i++) {
    const a = (i * Math.PI * 2) / 5;
    ellipse(ctx, x + Math.cos(a) * 2.4, y + Math.sin(a) * 2.4, 2, 2, 0, color);
  }
  ellipse(ctx, x, y, 1.4, 1.4, 0, "#ffd23f");
}

/* ---------- Shared helpers: branches ---------- */

// All tree branches share the same safe "hanging band": from o.top down to
// o.bottom, which is BRANCH_CLEARANCE above the ground.
function makeBranch(o) {
  o.w = CONFIG.BRANCH_WIDTH;
  o.bottom = CONFIG.GROUND_Y - CONFIG.BRANCH_CLEARANCE; // lowest SOLID point
  o.top = o.bottom - CONFIG.BRANCH_THICKNESS;           // top of the branch area
  o.trunkW = 22;
  o.trunkX = o.w - 34;
  o.seed = randInt(1, 100000);
}

// Solid parts: the branch (from solidTop down to o.bottom) and the trunk above it.
function branchBoxes(o, solidTop = o.top) {
  return [
    { x: 0, y: solidTop, w: o.w, h: o.bottom - solidTop },
    { x: o.trunkX, y: 0, w: o.trunkW, h: o.top + 12 },
  ];
}

// Vertical trunk coming down from the top edge of the screen.
function drawTrunk(ctx, o, color = "#6b4426", dark = "#4a2e17") {
  const tx = o.x + o.trunkX;
  ctx.fillStyle = color;
  ctx.fillRect(tx, 0, o.trunkW, o.top + 14);
  ctx.strokeStyle = dark;
  ctx.lineWidth = 2;
  ctx.strokeRect(tx, -2, o.trunkW, o.top + 16);
  ctx.lineWidth = 1.2;
  for (let yy = 30; yy < o.top; yy += 26) {
    ctx.beginPath();
    ctx.moveTo(tx + 5, yy);
    ctx.quadraticCurveTo(tx + 11, yy + 6, tx + 7, yy + 14);
    ctx.stroke();
  }
}

// Leafy blobs along the top edge (far above the panda's reach; decoration).
function drawCanopy(ctx, o, colors) {
  const rnd = seededRandom(o.seed);
  for (let i = 0; i < 7; i++) {
    const cx = o.x - 20 + (i / 6) * (o.w + 40);
    ellipse(ctx, cx, 6 + rnd() * 10, 22 + rnd() * 8, 16 + rnd() * 6, 0, colors[i % colors.length]);
  }
}

// The classic thin, slightly drooping limb from the trunk to the left.
function drawLimb(ctx, o, color = "#7a4e2c", dark = "#4a2e17") {
  const x = o.x, w = o.w, top = o.top, tx = o.x + o.trunkX;
  ctx.beginPath();
  ctx.moveTo(tx + 8, top + 2);
  ctx.quadraticCurveTo(x + w * 0.45, top + 6, x + 2, top + 12);
  ctx.lineTo(x + 4, top + 18);
  ctx.quadraticCurveTo(x + w * 0.45, top + 16, tx + 8, top + 22);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = dark;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + w * 0.4, top + 10);
  ctx.lineTo(x + w * 0.3, top + 1);
  ctx.lineWidth = 3;
  ctx.stroke();
}

// A thick limb whose underside reaches o.bottom (used by styles without
// hanging foliage, so the branch itself is the solid part).
function drawThickLimb(ctx, o, upper, color, dark) {
  const x = o.x, tx = o.x + o.trunkX, b = o.bottom;
  ctx.beginPath();
  ctx.moveTo(tx + 10, upper);
  ctx.quadraticCurveTo(x + o.w * 0.5, upper + 2, x + 2, upper + 6);
  ctx.quadraticCurveTo(x - 3, (upper + b) / 2 + 3, x + 4, b - 4);
  ctx.quadraticCurveTo(x + o.w * 0.5, b + 1, tx + 10, b);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = dark;
  ctx.lineWidth = 2;
  ctx.stroke();
}

// x positions along a branch for hanging leaves, fruit, blossoms...
function hangPoints(o, n) {
  const pts = [];
  for (let i = 0; i < n; i++) pts.push(o.x + 8 + (i / (n - 1)) * (o.w - 26));
  return pts;
}

function drawMapleLeaf(ctx, x, y, r, color) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + (i * Math.PI) / 5;
    const rr = i % 2 === 0 ? r : r * 0.5;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr * 0.95);
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = "rgba(90,30,10,0.6)";
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawBlossom(ctx, x, y, r) {
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + (i * Math.PI * 2) / 5;
    ellipse(ctx, x + Math.cos(a) * r * 0.55, y + Math.sin(a) * r * 0.55, r * 0.5, r * 0.5, 0, "#f9b9d0", "#e584a8", 0.8);
  }
  ellipse(ctx, x, y, r * 0.25, r * 0.25, 0, "#e0557f");
}

function drawBee(ctx, x, y, dir, t) {
  const flap = Math.sin(t * 40) * 2;
  ellipse(ctx, x - dir * 1, y - 4 - flap * 0.3, 3, 2 + Math.abs(flap) * 0.4, 0, "rgba(255,255,255,0.75)", "rgba(80,80,80,0.5)", 0.6);
  ellipse(ctx, x, y, 5, 3.4, 0, "#ffd23f", "#333", 1);
  ctx.strokeStyle = "#222";
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(x - 1, y - 3); ctx.lineTo(x - 1, y + 3);
  ctx.moveTo(x + 2 * -dir, y - 3); ctx.lineTo(x + 2 * -dir, y + 3);
  ctx.stroke();
  ellipse(ctx, x + dir * 4, y - 0.5, 0.9, 0.9, 0, "#222");
}
